        ? `Showing <b>${esc(sum.name)}</b> · ~${sum.areaKm2} km² · ${sum.mpp.toFixed(0)} m/cell`
        : "No terrain loaded. Pan the map over ground you hunt, then add it."
    }</div>
    ${areasHTML ? `<div class="area-list">${areasHTML}</div>` : ""}
    <div class="btn-row">
      <button class="btn btn-sm" id="btnAddTerrain" ${terrainBusy ? "disabled" : ""}>Add this view as terrain</button>
      ${has ? `<button class="btn btn-sm btn-ghost" id="btnReloadTerrain">Re-pull this area</button>` : ""}
    </div>
    ${
      has
        ? `<label class="fld"><input type="checkbox" id="terrainShow" ${
            s.terrainShow ? "checked" : ""
          }/> Show overlay</label>
      <label class="fld">Overlay</label>
      <select id="terrainMode">${modeOpts}</select>
      <label class="fld">Opacity <span id="terrainOpVal">${
        s.terrainOpacity != null ? s.terrainOpacity : 65
      }%</span></label>
      <input type="range" id="terrainOp" min="10" max="100" step="5" value="${
        s.terrainOpacity != null ? s.terrainOpacity : 65
      }" style="width:100%" />
      <div id="terrainLegend" class="hint"></div>
      <div class="hint">Tap the map to read elevation, slope, aspect and thermal at a point.</div>`
        : ""
    }`;

  const ab = $("#btnAddTerrain");
  if (ab) ab.onclick = () => loadTerrainForView();
  const rb = $("#btnReloadTerrain");
  if (rb) rb.onclick = () => loadTerrainForView({ replaceId: activeId, name: sum.name });

  $$("[data-aa]", box).forEach((b) => {
    const id = b.dataset.id;
    b.onclick = async (ev) => {
      ev.stopPropagation();
      if (b.dataset.aa === "switch") switchTerrainArea(id);
      else if (b.dataset.aa === "ren") {
        const nv = prompt("Name this area:", (terrainAreas.find((a) => a.id === id) || {}).name || "");
        if (nv) {
          await DPTerrain.renameArea(id, nv);
          refreshTerrainAreas();
        }
      } else if (b.dataset.aa === "del") {
        if (!confirm("Delete this saved terrain?")) return;
        await DPTerrain.deleteArea(id);
        if (!DPTerrain.current) state.settings.terrainShow = false;
        saveState();
        refreshTerrainOverlay();
        renderStands();
        renderScoutPanel();
        refreshTerrainAreas();
      }
    };
  });
  const sh = $("#terrainShow");
  if (sh)
    sh.onchange = (e) => {
      state.settings.terrainShow = e.target.checked;
      saveState();
      refreshTerrainOverlay();
    };
  const md = $("#terrainMode");
  if (md)
    md.onchange = (e) => {
      state.settings.terrainMode = e.target.value;
      saveState();
      refreshTerrainOverlay();
      renderTerrainLegend();
    };
  const op = $("#terrainOp");
  if (op)
    op.oninput = (e) => {
      state.settings.terrainOpacity = +e.target.value;
      $("#terrainOpVal").textContent = e.target.value + "%";
      if (terrainOverlay) terrainOverlay.setOpacity(+e.target.value / 100);
      saveState();
    };
  renderTerrainLegend();
}

function renderTerrainLegend() {
  const el = $("#terrainLegend");
  if (!el || !window.DPTerrain || !DPTerrain.current) return;
  const mode = state.settings.terrainMode || "movement";
  const sw = (rgb, label) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0">
      <span style="width:12px;height:12px;border-radius:3px;background:rgb(${rgb.join(",")})"></span>${label}</span>`;
  if (mode === "landform") {
    el.innerHTML = DPTerrain.LF_NAME.map((n, i) => sw(DPTerrain.LF_COLOR[i], n)).join("");
  } else if (mode === "movement") {
    el.innerHTML =
      sw([60, 160, 90], "lower") + sw([230, 150, 50], "moderate") + sw([215, 65, 55], "higher travel odds");
  } else if (mode === "slope") {
    el.innerHTML = sw([60, 160, 90], "flat") + sw([230, 150, 50], "~18°") + sw([215, 65, 55], "35°+");
  } else {
    el.innerHTML = "Hue = downhill direction (which way thermals drain / sun hits).";
  }
}

function wirePanel() {
  $$("[data-toggle]").forEach((b) => {
    b.onclick = () => {
      const sec = b.closest(".sec");
      sec.classList.toggle("collapsed");
      if (!sec.classList.contains("collapsed") && sec.dataset.sec === "offline") renderOfflinePanel();
    };
  });

  $("#huntDate").onchange = (e) => {
    state.settings.date = e.target.value || todayISO();
    saveState();
    updateHuntMomentHint();
    renderStands();
  };
  $$("#winSeg button").forEach((b) => {
    b.onclick = () => {
      state.settings.window = b.dataset.w;
      saveState();
      $$("#winSeg button").forEach((x) => x.classList.toggle("on", x === b));
      $("#customWrap").style.display = b.dataset.w === "CUSTOM" ? "" : "none";
      updateHuntMomentHint();
      renderStands();
      refreshTerrainOverlay();
    };
  });
  const ht = $("#huntTime");
  if (ht)
    ht.onchange = (e) => {
      state.settings.customTime = e.target.value || "17:00";
      saveState();
      updateHuntMomentHint();
      renderStands();
      refreshTerrainOverlay();
    };

}

function updateHuntMomentHint() {
  const hint = $("#huntMomentHint");
  if (!hint) return;
  const di = dailyIndexFor(state.settings.date);
  const daily = wx && wx.data && wx.data.daily;
  let sun = "";
  if (di >= 0 && daily) {
    const sr = parseWx(daily.sunrise[di]),
      ss = parseWx(daily.sunset[di]);
    sun = `Sunrise ${fmtClock(sr)} · Sunset ${fmtClock(ss)}`;
  }
  const m = huntMoment();
  const s = state.settings;
  const presetLabel = s.weights
    ? "custom weights"
    : (DPResearch.PRESETS[s.preset || "balanced"] || {}).label || "Balanced";
  const rut = DPResearch.rutPhase(s.date);
  const model =
    (window.DPTerrain && DPTerrain.current ? "wind + thermals + " : "wind + ") +
    `research (${presetLabel})`;
  hint.innerHTML =
    `Scoring for <b>${fmtClock(m)}</b> on ${esc(s.date)}. ` +
    (sun ? sun + ". " : "") +
    `Rut phase: <b>${esc(rut.label)}</b>. ` +
    `Model: <code>${esc(model)}</code>`;
  renderBrief();
}
const fmtClock = (d) => {
  const tz = wx && wx.data && wx.data.timezone;
  try {
    return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz || undefined });
  } catch (e) {
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
};

/* ---- today's read (briefing card) ---- */
function briefTopStands() {
  return pStands()
    .map((st) => ({ st, r: scoreStand(st) }))
    .filter((x) => x.r.score != null)
    .sort((a, b) => b.r.score - a.r.score)
    .slice(0, 3);
}

function renderBrief() {
  const box = $("#briefBox");
  if (!box) return;
  const s = state.settings;
  const winLabel = s.window === "AM" ? "Morning" : s.window === "PM" ? "Evening" : "Custom";
  const dLabel = new Date(s.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  if (!wx || !wx.data) {
    box.innerHTML = `<div class="brief">
      <div class="brief-hd"><span class="brief-rate n">—</span><b>${winLabel} · ${esc(dLabel)}</b></div>
      <div class="hint">Weather hasn't loaded yet. Open the app on wifi or cell service before you head out so the forecast — and the map — are cached for the woods.</div>
    </div>`;
    return;
  }

  const mo = movementOutlook();
  const c = conditionsAtHunt();
  const ll = legalLight();
  const sh = sitWindShift();
  const rain = rainInSit();
  const dt = dayTemps(s.date);
  const rateCls = mo ? (mo.rating === "Prime" || mo.rating === "Good" ? "g" : mo.rating === "Fair" ? "m" : "b") : "n";

  const windLine = c
    ? `Wind <b>${degToCompass8(c.windFrom)} ${Math.round(c.windMph)}</b>` +
      (c.gustMph && c.gustMph - c.windMph > 6 ? ` g${Math.round(c.gustMph)}` : "") +
      (sh && sh.shifts ? ` → clocks <b>${sh.fromB} ${sh.spdB}</b> by ${fmtClock(sh.end)} <span class="warn">⚠</span>` : "")
    : "";

  let tempLine = "";
  if (c && c.tempF != null) {
    tempLine = `${Math.round(c.tempF)}° at the sit`;
    if (dt.todayMaxF != null && dt.yesterdayMaxF != null) {
      const d = Math.round(dt.yesterdayMaxF - dt.todayMaxF);
      if (Math.abs(d) >= 4) tempLine += ` · ${Math.abs(d)}° ${d > 0 ? "colder" : "warmer"} than yesterday`;
    }
  }

  let rainLine = "Rain: dry through the sit";
  if (rain && rain.anyWet)
    rainLine = rain.firstWet
      ? `Rain: starts ~${fmtClock(rain.firstWet)}${rain.maxProb ? ` (${rain.maxProb}%)` : ""}, ${rain.total}" in the window`
      : `Rain: about ${rain.total}" likely in the window`;
  else if (rain && rain.maxProb >= 40)
    rainLine = `Rain: ${rain.maxProb}% chance, little to no accumulation`;

  let lightLine = "";
  if (ll)
    lightLine =
      s.window === "AM"
        ? `Legal light from ${fmtClock(ll.amStart)} · sunrise ${fmtClock(ll.sunrise)}`
        : `Legal light to ${fmtClock(ll.pmEnd)} · sunset ${fmtClock(ll.sunset)}`;

  const tops = briefTopStands();
  let standLine, trendLine = "", approachLine = "";
  if (tops.length) {
    standLine = "Top: " + tops.map((x) => `<b>${esc(x.st.name)}</b> ${x.r.score}`).join(" · ");
    const tr = tops
      .map((x) => { const t = standSitTrend(x.st); return t ? `${x.st.name} ${t.short}` : null; })
      .filter(Boolean);
    if (tr.length) trendLine = `<div class="brief-warn">⚠ ${esc(tr.join(" · "))}</div>`;
    const ap = standApproach(tops[0].st);
    if (ap) approachLine = `<div>${esc(tops[0].st.name)}: ${esc(ap.text)}</div>`;
  } else {
    standLine = `<span class="brief-dim">Add stands with winds set to get a ranking.</span>`;
  }

  box.innerHTML = `<div class="brief">
    <div class="brief-hd">
      <span class="brief-rate ${rateCls}">${mo ? mo.rating : "—"}</span>
      <b>${winLabel} · ${esc(dLabel)}</b>
    </div>
    ${mo && mo.notes.length ? `<div class="brief-why">${esc(mo.notes.slice(0, 3).join(" · "))}</div>` : ""}
    <div class="brief-rows">
      ${windLine ? `<div>${windLine}</div>` : ""}
      ${tempLine ? `<div>${tempLine}</div>` : ""}
      <div>${rainLine}</div>
      ${lightLine ? `<div>${lightLine}</div>` : ""}
      <div>${standLine}</div>
      ${approachLine}
    </div>
    ${trendLine}
  </div>`;
}

/* ---- weather panel ---- */
function renderWeather() {
  const box = $("#wxBox");
  if (!box) return;
  if (!wx || !wx.data) {
    box.innerHTML = `<div class="empty">${
      wxError ? esc(wxError) : "Loading weather…"
    } <button class="btn btn-sm btn-ghost" id="wxRetry">Retry</button></div>`;
    const r = $("#wxRetry");
    if (r) r.onclick = () => fetchWeather(true);
    return;
  }
  const s = state.settings;
  const cur = wx.data.current;
  const tr = pressureTrend();
  const ageMin = Math.round((Date.now() - wx.ts) / 60000);
  const wc = degToCompass8(cur.wind_direction_10m);
  const rn = rainInSit();
  const rainMeta = rn && rn.anyWet
    ? `Rain in the sit: ${rn.total}"${rn.firstWet ? ` from ~${fmtClock(rn.firstWet)}` : ""}`
    : cur.precipitation
    ? `Precip now ${cur.precipitation}"`
    : "";
  const gpsOpts = [["0", "never"], ["10", "10 min"], ["20", "20 min"], ["45", "45 min"], ["90", "90 min"]];

  let hoursHTML = "";
  const h = wx.data.hourly;
  const now = hourIndex(new Date());
  const mIdx = hourIndex(huntMoment());
  if (now >= 0) {
    for (let i = now; i < Math.min(now + 13, h.time.length); i++) {
      const dt = parseWx(h.time[i]);
      const hr = hourAtProperty(dt);
      const to = (h.wind_direction_10m[i] + 180) % 360;
      hoursHTML +=
        `<div class="wx-hr${i === mIdx ? " win" : ""}">` +
        `${hr % 12 || 12}${hr < 12 ? "a" : "p"}` +
        `<b>${fmtF(h.temperature_2m[i])}</b>` +
        `<span class="arr" style="transform:rotate(${to}deg)">↑</span>` +
        `${Math.round(h.wind_speed_10m[i])}` +
        `</div>`;
    }
  }

  box.innerHTML =
    `<div class="wx">
      <div class="wx-now">
        <span class="wx-temp">${fmtF(cur.temperature_2m)}F</span>
        <span class="wx-wind">${wc} wind ${Math.round(cur.wind_speed_10m)} mph${
      cur.wind_gusts_10m ? ` (g${Math.round(cur.wind_gusts_10m)})` : ""
    }</span>
      </div>
      <div class="wx-meta wx-trend">
        ${cur.relative_humidity_2m}% RH ·
        Pressure ${hpaToInHg(cur.pressure_msl).toFixed(2)} inHg
        ${
          tr
            ? ` · <span class="${tr.dir === "rising" ? "up" : tr.dir === "falling" ? "down" : ""}">${
                tr.dir
              } ${tr.deltaHpa > 0 ? "+" : ""}${tr.deltaHpa.toFixed(1)} hPa/6h</span>`
            : ""
        }
      </div>
      ${rainMeta ? `<div class="wx-meta">${rainMeta}</div>` : ""}
      <div class="wx-meta ${wx.stale ? "wx-stale" : ""}">
        ${wx.stale ? "⚠ last saved " : "updated "}${ageMin} min ago
        · <a href="#" id="wxRefresh" style="color:var(--link)">refresh</a>
      </div>
      <div class="wx-hours">${hoursHTML || '<span class="wx-meta">no hourly data</span>'}</div>
      <div class="wx-toggles">
        <label><input type="checkbox" id="tgScent"${s.scentCone ? " checked" : ""}/> scent check (tap a stand)</label>
        <label>GPS auto-off
          <select id="gpsOff">${gpsOpts
            .map(([v, l]) => `<option value="${v}"${String(s.gpsAutoOffMin) === v ? " selected" : ""}>${l}</option>`)
            .join("")}</select>
        </label>
      </div>
    </div>`;

  const rf = $("#wxRefresh");
  if (rf)
    rf.onclick = (e) => {
      e.preventDefault();
      fetchWeather(true);
    };
  const tgs = $("#tgScent");
  if (tgs)
    tgs.onchange = (e) => {
      state.settings.scentCone = e.target.checked;
      saveState();
      if (!e.target.checked) clearScent();
    };
  const go = $("#gpsOff");
  if (go)
    go.onchange = (e) => {
      state.settings.gpsAutoOffMin = +e.target.value;
      saveState();
      if (locateOn) armGpsTimer();
    };
}

/* ---- stands panel ---- */
function renderStands(focusEditor) {
  renderStandMarkers();
  const list = $("#standList");
  const add = $("#standAdd");
  if (!list) return;
  if (add) {
    add.innerHTML = placeControlsHTML("stand");
    wirePlaceControls(add);
  }

  if (!pStands().length) {
    list.innerHTML = `<div class="empty">No stands yet — use <b>+ Add stand</b> above, or the + button on the map.</div>`;
    return;
  }

  const scored = pStands()
    .map((st) => ({ st, r: scoreStand(st) }))
    .sort((a, b) => {
      if (a.r.score == null && b.r.score == null) return 0;
      if (a.r.score == null) return 1;
      if (b.r.score == null) return -1;
      return b.r.score - a.r.score;
    });

  const top = scored.find((x) => x.r.score != null);
  const bestLine =
    top && scored.length > 1
      ? `<div class="best">Best for this sit: <b>${esc(top.st.name)}</b> · ${top.r.score}</div>`
      : "";

  const rows = scored
    .map(({ st, r }) => {
      const cls = scoreClass(r.score);
      let restTag = "";
      if (r.rest && r.rest.daysAgo != null && r.restMod <= -2)
        restTag = ` · <span class="rest-tag">${r.rest.daysAgo <= 0 ? "sat today" : "sat " + r.rest.daysAgo + "d ago"}</span>`;
      const trend = standSitTrend(st);
      const trendTag = trend ? ` · <span class="warn-tag">${trend.short}</span>` : "";
      return `<div class="stand ${st.id === selectedStandId ? "sel" : ""}" data-id="${st.id}">
        <span class="score ${cls}">${r.score == null ? "–" : r.score}</span>
        <span class="nm">${esc(st.name)}<div class="ty">${esc(st.type)}${
        deerDirsOf(st).length ? " · deer " + deerDirsOf(st).join("/") : st.goodWinds.length ? " · " + st.goodWinds.join("/") : ""
      }${restTag}${trendTag}</div></span>
      </div>`;
    })
    .join("");

  const sel = state.stands.find((s) => s.id === selectedStandId);
  const editing = sel && editingStandId === sel.id;
  const navingThis = sel && navTarget && navTarget.standId === sel.id;
  const selBar =
    sel && !editing
      ? `<div class="btn-row" style="margin-top:8px">
           <button class="btn btn-sm" id="btnEditStand">Edit ${esc(sel.name)}</button>
           <button class="btn btn-sm btn-ghost" id="btnStandMap">Show on map</button>
           <button class="btn btn-sm btn-ghost" id="btnMoveStand">Move</button>
           <button class="btn btn-sm btn-ghost" id="btnStandPhotos">Photos</button>
           <button class="btn btn-sm ${navingThis ? "" : "btn-ghost"}" id="btnGoTo">${navingThis ? "Stop navigating" : "Go to"}</button>
         </div>`
      : "";
  list.innerHTML = bestLine + rows + selBar + (editing ? standEditor(sel) : "");

  $$(".stand", list).forEach((n) => {
    n.onclick = () => selectStand(n.dataset.id);
  });
  const be = $("#btnEditStand");
  if (be)
    be.onclick = () => {
      editingStandId = sel.id;
      renderStands(true);
      renderResearchPanel();
    };
  const bm = $("#btnStandMap");
  if (bm)
    bm.onclick = () => {
      map.setView([sel.lat, sel.lng], Math.max(map.getZoom(), 16));
      if (window.matchMedia("(max-width:640px)").matches) hidePanel();
    };
  const mv = $("#btnMoveStand");
  if (mv) mv.onclick = () => beginMovePin("stand", sel.id);
  const ph = $("#btnStandPhotos");
  if (ph) ph.onclick = () => openPhotoModal("stand", sel.id, sel.name);
  const gt = $("#btnGoTo");
  if (gt)
    gt.onclick = () => {
      startNavTo(sel.lat, sel.lng, sel.name, sel.id);
      renderStands();
    };
  if (editing) wireEditor(sel);
  if (focusEditor && editing) {
    const nm = $("#edName");
    if (nm) nm.focus();
  }
}

function standEditor(st) {
  const r = scoreStand(st);
  const winds = DIRS8.map(
    (d) =>
      `<div class="chip ${st.goodWinds.includes(d) ? "on" : ""}" data-wind="${d}">${d}</div>`
  ).join("");
  const deerChips = DIRS8.map(
    (d) => `<div class="chip ${deerDirsOf(st).includes(d) ? "on" : ""}" data-deer="${d}">${d}</div>`
  ).join("");
  const factors = r.factors
    .map((f) => `<span class="f ${f.cls}">${f.cls === "plus" ? "+ " : f.cls === "minus" ? "− " : ""}${esc(f.t)}</span>`)
    .join("");
  const rec = r.score == null ? "" : esc(recommendationText(st));
  const breakdown =
    r.ev == null
      ? ""
      : `<div class="explain" style="margin-top:4px">Scent fitness ${Math.round(r.fit.base)} · day drivers ${
          r.dayMod > 0 ? "+" : ""
        }${r.dayMod} · terrain ${r.spotMod > 0 ? "+" : ""}${r.spotMod}${
          r.restMod < 0 ? ` · rest ${r.restMod}` : ""
        }</div>`;

  return `<div class="editor" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
    <label class="fld">Name</label>
    <input type="text" id="edName" value="${esc(st.name)}" />
    <label class="fld">Type</label>
    <div class="seg" id="edType">
      <button data-t="fixed" class="${st.type === "fixed" ? "on" : ""}">Fixed</button>
      <button data-t="mobile" class="${st.type === "mobile" ? "on" : ""}">Mobile</button>
    </div>
    <label class="fld">Coordinates</label>
    <div class="row">
      <input type="text" id="edLat" value="${st.lat.toFixed(6)}" />
      <input type="text" id="edLng" value="${st.lng.toFixed(6)}" />
    </div>
    <div class="btn-row">
      <button class="btn btn-sm btn-ghost" id="edCopy">Copy coords</button>
      <button class="btn btn-sm btn-ghost" id="edHere">Set to my location</button>
    </div>
    <label class="fld">Good winds (wind coming <i>from</i>)</label>
    <div class="chips" id="edWinds">${winds}</div>
    <label class="fld">Deer approach direction — tap all that apply</label>
    <div class="chips" id="edDeer">${deerChips}</div>
    <label class="fld">Notes</label>
    <textarea id="edNotes">${esc(st.notes || "")}</textarea>
    ${rec ? `<div class="rec"><b>Score ${r.score}/100.</b> ${rec}</div>` : `<div class="explain"><b>Score —</b></div>`}
    ${breakdown}
    ${(() => { const a = standApproach(st); return a ? `<div class="explain" style="margin-top:4px;color:var(--good)">→ ${esc(a.text)}</div>` : ""; })()}
    ${(() => { const t = standSitTrend(st); return t ? `<div class="explain" style="margin-top:4px;color:var(--mid)">⚠ ${esc(t.text)}</div>` : ""; })()}
    ${(() => {
      const rl = standReliability(st);
      const hv = pHarvests().filter(
        (h) => h.stand === st.id || map.distance([h.lat, h.lng], [st.lat, st.lng]) < 70
      );
      const hvLine = hv.length
        ? `<div class="explain" style="margin-top:4px">History: ${hv.length} deer taken here (${hv
            .map((h) => harvestLabel(h).split(" · ")[0])
            .join(", ")})</div>`
        : "";
      return `<div class="explain" style="margin-top:4px"><span class="rel-badge ${RELIA_CLASS[rl.label] || "n"}">${esc(rl.label)}</span> ${esc(rl.note)}</div>${hvLine}`;
    })()}
    <details class="fac"><summary>Full breakdown</summary><div class="explain">${factors}</div></details>
    <label class="fld">Sit history</label>
    ${(() => {
      const mine = (state.sits || []).filter((s) => s.standId === st.id);
      const hunts = mine.filter((s) => s.type !== "pressure").length;
      const press = mine.filter((s) => s.type === "pressure").length;
      const last = mine.map((s) => s.date).sort().slice(-1)[0];
      const parts = [`${hunts} hunt${hunts !== 1 ? "s" : ""}`];
      if (press) parts.push(`${press} pressure`);
      if (last) parts.push("last " + new Date(last + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }));
      return `<div class="explain">${parts.join(" · ")} — <a href="#" id="edStartSit">start a sit here</a></div>`;
    })()}
    <div class="btn-row">
      <button class="btn btn-sm" id="edDone">Done</button>
      <button class="btn btn-sm btn-ghost" id="edPan">Show on map</button>
      <button class="btn btn-sm btn-danger" id="edDel">Delete</button>
    </div>
  </div>`;
}

/* ---- sit log — a running observation log during the hunt ---- */
let startSitPicker = false;
let pressForm = false;
let obsForm = false;
let expandedSit = null;
let sitElapsedTimer = null;

const OBS_KINDS = [["doe", "Doe"], ["buck", "Buck"], ["group", "Group"], ["other", "Other"]];
const OBS_BEHAV = [["calm", "Calm"], ["alert", "Alert"], ["spooked", "Spooked"]];

function curWind() {
  const c = wx && wx.data && wx.data.current;
  if (!c || c.wind_direction_10m == null) return null;
  return {
    from: degToCompass8(c.wind_direction_10m),
    mph: Math.round(c.wind_speed_10m),
    gust: c.wind_gusts_10m ? Math.round(c.wind_gusts_10m) : null,
  };
}
function winByClock() {
  const h = new Date().getHours();
  return h < 11 ? "AM" : h < 14 ? "DAY" : "PM";
}
function elapsedStr(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function fmtClockTs(ts) {
  try { return new Date(ts).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  catch (e) { return ""; }
}
function sitStandName(id) {
  return (state.stands.find((s) => s.id === id) || {}).name || "(stand removed)";
}
function obsKindLabel(o) {
  const base = (OBS_KINDS.find((k) => k[0] === o.kind) || ["", "Deer"])[1];
  return o.count ? `${base} ×${o.count}` : base;
}

function startSit(standId, win) {
  if (state.activeSit) { toast("Finish the current sit first"); openSection("sitlog"); return; }
  state.activeSit = {
    id: uid(), standId, date: todayISO(),
    window: win || winByClock(),
    startTs: Date.now(), obs: [], note: "",
  };
  startSitPicker = false;
  obsForm = false;
  saveState();
  openSection("sitlog");
  renderSitLog();
  renderStands();
  toast(`Sit started — ${sitStandName(standId)}`);
  if (window.matchMedia && window.matchMedia("(max-width:640px)").matches) hidePanel();
}
function endSit() {
  const a = state.activeSit;
  if (!a) return;
  a.endTs = Date.now();
  a.type = "hunt";
  state.sits.push(a);
  state.activeSit = null;
  obsForm = false;
  clearInterval(sitElapsedTimer);
  saveState();
  renderSitLog();
  renderStands();
  updateHuntMomentHint();
  toast("Sit filed");
}
function addObs(data) {
  const a = state.activeSit;
  if (!a) return;
  const w = curWind();
  a.obs.push({
    id: uid(), ts: Date.now(),
    kind: data.kind, count: data.count || null,
    fromDirs: data.fromDirs || [],
    behavior: data.behavior || "calm",
    windFrom: w ? w.from : "", windMph: w ? w.mph : null,
    note: data.note || "",
  });
  obsForm = false;
  saveState();
  renderSitLog();
  const st = state.stands.find((s) => s.id === a.standId);
  if (st && data.kind !== "other") {
    const fresh = (data.fromDirs || []).filter((d) => !deerDirsOf(st).includes(d));
    if (fresh.length) toast(`Deer from ${fresh.join("/")} — add to ${st.name}'s approach chips?`);
  }
  if (data.behavior === "spooked") renderStands();
}
function delObs(obsId) {
  const a = state.activeSit;
  if (a && a.obs.some((o) => o.id === obsId)) {
    a.obs = a.obs.filter((o) => o.id !== obsId);
  } else {
    (state.sits || []).forEach((s) => { if (s.obs) s.obs = s.obs.filter((o) => o.id !== obsId); });
  }
  saveState();
  renderSitLog();
}
function delSit(id) {
  state.sits = (state.sits || []).filter((s) => s.id !== id);
  saveState();
  renderSitLog();
  renderStands();
}
function logPressure(standId, severity, note) {
  state.sits.push({
    id: uid(), standId, date: todayISO(), window: "PM",
    type: "pressure", severity: severity || "medium", note: note || "",
  });
  pressForm = false;
  saveState();
  renderSitLog();
  renderStands();
  toast("Pressure logged");
}

function obsRowHTML(o, canDel) {
  const bits = [
    fmtClockTs(o.ts),
    obsKindLabel(o),
    o.fromDirs && o.fromDirs.length ? "from " + o.fromDirs.join("/") : "",
    o.behavior && o.behavior !== "calm" ? o.behavior : "",
    o.windFrom ? o.windFrom + (o.windMph != null ? o.windMph : "") : "",
  ].filter(Boolean);
  return `<div class="sit-row ${o.behavior === "spooked" ? "spooked" : ""}">
    <span>${esc(bits.join(" · "))}${o.note ? " — " + esc(o.note) : ""}</span>
    ${canDel ? `<button class="sit-del" data-obsdel="${o.id}">✕</button>` : ""}
  </div>`;
}
function obsFormHTML() {
  const w = curWind();
  return `<div class="sit-form">
    <label class="fld">What</label>
    <div class="seg" id="obKind">${OBS_KINDS.map((k, i) => `<button data-k="${k[0]}" class="${i === 0 ? "on" : ""}">${k[1]}</button>`).join("")}</div>
    <input type="number" id="obCount" placeholder="# deer (optional)" min="1" max="99" />
    <label class="fld">Came from</label>
    <div class="chips" id="obFrom">${DIRS8.map((d) => `<div class="chip" data-deer="${d}">${d}</div>`).join("")}</div>
    <label class="fld">Behavior</label>
    <div class="seg" id="obBeh">${OBS_BEHAV.map((b, i) => `<button data-b="${b[0]}" class="${i === 0 ? "on" : ""}">${b[1]}</button>`).join("")}</div>
    <input type="text" id="obNote" placeholder="note (optional)" />
    <div class="hint">Stamped now${w ? ` · wind ${w.from} ${w.mph}` : " · wind unknown (offline)"}</div>
    <div class="btn-row">
      <button class="btn btn-sm" id="obSave">Add sighting</button>
      <button class="btn btn-sm btn-ghost" id="obCancel">Cancel</button>
    </div>
  </div>`;
}
function activeSitHTML(a) {
  const w = curWind();
  const rows = a.obs.length
    ? a.obs.slice().reverse().map((o) => obsRowHTML(o, true)).join("")
    : `<div class="hint">No sightings yet. Tap “+ Sighting” each time a deer shows up.</div>`;
  return `<div class="sit-active">
    <div class="sit-hd">Sitting <b>${esc(sitStandName(a.standId))}</b> · ${a.window}
      <span id="sitElapsed" class="sit-elapsed">${elapsedStr(Date.now() - a.startTs)}</span></div>
    <div class="sit-wind">${w ? `Wind now <b>${w.from} ${w.mph}</b>${w.gust && w.gust - w.mph > 6 ? ` g${w.gust}` : ""}` : "Wind unavailable (offline)"}</div>
    <div class="btn-row">
      <button class="btn btn-sm" id="obAdd">+ Sighting</button>
      <button class="btn btn-sm btn-ghost" id="sitEnd">End sit</button>
    </div>
    ${obsForm ? obsFormHTML() : ""}
    <div class="obs-list">${rows}</div>
    <textarea id="sitNote" placeholder="overall sit note (optional)">${esc(a.note || "")}</textarea>
  </div>`;
}
function filedSitHTML(s) {
  const d = new Date((s.date || todayISO()) + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  if (s.type === "pressure")
    return `<div class="sit-row"><span>${d} · ${esc(sitStandName(s.standId))} · pressure (${esc(s.severity || "med")})${
      s.note ? " — " + esc(s.note.slice(0, 40)) : ""
    }</span><button class="sit-del" data-sitdel="${s.id}">✕</button></div>`;
  const n = (s.obs || []).length;
  const bucks = (s.obs || []).filter((o) => o.kind === "buck").length;
  const spooked = (s.obs || []).some((o) => o.behavior === "spooked");
  const seen = n ? `${n} sighting${n > 1 ? "s" : ""}${bucks ? ` · ${bucks} buck` : ""}` : "saw nothing";
  return `<div class="sit-row expandable" data-sit="${s.id}">
      <span>${d} · ${s.window} · ${esc(sitStandName(s.standId))} — ${seen}${spooked ? " ⚠" : ""}</span>
      <button class="sit-del" data-sitdel="${s.id}">✕</button>
    </div>${
      expandedSit === s.id
        ? `<div class="sit-obs-expand">${
            (s.obs || []).map((o) => obsRowHTML(o, true)).join("") || `<div class="hint">No sightings logged.</div>`
          }${s.note ? `<div class="hint">Note: ${esc(s.note)}</div>` : ""}</div>`
        : ""
    }`;
}

function renderSitLog() {
  const box = $("#sitlogBox");
  if (!box) return;
  const a = state.activeSit;
  if (a) {
    box.innerHTML = activeSitHTML(a);
    wireActiveSit();
    armSitElapsed();
    return;
  }
  clearInterval(sitElapsedTimer);

  const stands = pStands();
  const filed = (state.sits || [])
    .filter((s) => stands.some((x) => x.id === s.standId))
    .slice()
    .sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0))
    .slice(0, 14);
  const stOpts = stands
    .map((x) => `<option value="${x.id}"${x.id === selectedStandId ? " selected" : ""}>${esc(x.name)}</option>`)
    .join("");

  box.innerHTML =
    (stands.length
      ? `<div class="btn-row">
           <button class="btn btn-sm" id="btnStartSit">Start a sit</button>
           <button class="btn btn-sm btn-ghost" id="btnLogPress">Log pressure</button>
         </div>`
      : `<div class="hint">Add a stand first — a sit is logged against a stand.</div>`) +
    (startSitPicker
      ? `<div class="sit-form">
           <label class="fld">Stand</label><select id="ssStand">${stOpts}</select>
           <label class="fld">Window</label>
           <div class="seg" id="ssWin">${["AM", "DAY", "PM"]
             .map((wv) => `<button data-w="${wv}" class="${wv === winByClock() ? "on" : ""}">${wv}</button>`)
             .join("")}</div>
           <div class="btn-row">
             <button class="btn btn-sm" id="ssGo">Start</button>
             <button class="btn btn-sm btn-ghost" id="ssCancel">Cancel</button>
           </div>
         </div>`
      : "") +
    (pressForm
      ? `<div class="sit-form">
           <label class="fld">Stand</label><select id="pfStand">${stOpts}</select>
           <label class="fld">Severity</label>
           <div class="seg" id="pfSev">${["light", "medium", "heavy"]
             .map((sv) => `<button data-s="${sv}" class="${sv === "medium" ? "on" : ""}">${sv}</button>`)
             .join("")}</div>
           <input type="text" id="pfNote" placeholder="what happened (dog, neighbor, bumped deer…)" />
           <div class="btn-row">
             <button class="btn btn-sm" id="pfGo">Log it</button>
             <button class="btn btn-sm btn-ghost" id="pfCancel">Cancel</button>
           </div>
         </div>`
      : "") +
    (filed.length
      ? `<div class="sit-list">${filed.map(filedSitHTML).join("")}</div>`
      : `<div class="hint" style="margin-top:8px">No sits logged yet.</div>`);

  wireSitIdle();
}

function armSitElapsed() {
  clearInterval(sitElapsedTimer);
  sitElapsedTimer = setInterval(() => {
    const a = state.activeSit, el = $("#sitElapsed");
    if (!a || !el) { clearInterval(sitElapsedTimer); return; }
    el.textContent = elapsedStr(Date.now() - a.startTs);
  }, 60000);
}
function wireSeg(sel) {
  $$(`${sel} button`).forEach((b) => {
    b.onclick = () => b.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  });
}
function onDatum(el, keys) {
  if (!el) return null;
  const sel = el.querySelector(".on");
  if (!sel) return null;
  for (const k of keys) if (sel.dataset[k] != null) return sel.dataset[k];
  return null;
}

function wireSitIdle() {
  const bs = $("#btnStartSit");
  if (bs) bs.onclick = () => { startSitPicker = true; pressForm = false; renderSitLog(); };
  const bp = $("#btnLogPress");
  if (bp) bp.onclick = () => { pressForm = true; startSitPicker = false; renderSitLog(); };

  const sc = $("#ssCancel");
  if (sc) sc.onclick = () => { startSitPicker = false; renderSitLog(); };
  wireSeg("#ssWin");
  const sg = $("#ssGo");
  if (sg) sg.onclick = () => {
    const id = $("#ssStand") && $("#ssStand").value;
    if (id) startSit(id, onDatum($("#ssWin"), ["w"]) || winByClock());
  };

  const pc = $("#pfCancel");
  if (pc) pc.onclick = () => { pressForm = false; renderSitLog(); };
  wireSeg("#pfSev");
  const pg = $("#pfGo");
  if (pg) pg.onclick = () => {
    const id = $("#pfStand") && $("#pfStand").value;
    if (id) logPressure(id, onDatum($("#pfSev"), ["s"]) || "medium", $("#pfNote") ? $("#pfNote").value : "");
  };

  $$("[data-sitdel]").forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); if (confirm("Delete this entry?")) delSit(b.dataset.sitdel); };
  });
  $$("[data-obsdel]").forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); delObs(b.dataset.obsdel); };
  });
  $$(".sit-row.expandable").forEach((n) => {
    n.onclick = () => { expandedSit = expandedSit === n.dataset.sit ? null : n.dataset.sit; renderSitLog(); };
  });
}

function wireActiveSit() {
  const add = $("#obAdd");
  if (add) add.onclick = () => { obsForm = !obsForm; renderSitLog(); };
  const end = $("#sitEnd");
  if (end) end.onclick = () => { if (confirm("End this sit?")) endSit(); };
  const note = $("#sitNote");
  if (note) note.onchange = (e) => { if (state.activeSit) { state.activeSit.note = e.target.value; saveState(); } };

  wireSeg("#obKind");
  wireSeg("#obBeh");
  $$("#obFrom .chip").forEach((c) => { c.onclick = () => c.classList.toggle("on"); });
  const oc = $("#obCancel");
  if (oc) oc.onclick = () => { obsForm = false; renderSitLog(); };
  const os = $("#obSave");
  if (os) os.onclick = () => addObs({
    kind: onDatum($("#obKind"), ["k"]) || "doe",
    count: $("#obCount") && $("#obCount").value ? +$("#obCount").value : null,
    fromDirs: $$("#obFrom .chip.on").map((c) => c.dataset.deer),
    behavior: onDatum($("#obBeh"), ["b"]) || "calm",
    note: $("#obNote") ? $("#obNote").value : "",
  });
  $$("[data-obsdel]").forEach((b) => { b.onclick = () => delObs(b.dataset.obsdel); });
}

function wireEditor(st) {
  $("#edName").onchange = (e) => {
    st.name = e.target.value || st.name;
    saveState();
    renderStands();
    st.name = e.target.value || st.name;
    saveState();
    renderStands();
  };
  $$("#edType button").forEach((b) => {
    b.onclick = () => {
      st.type = b.dataset.t;
      saveState();
      renderStands();
    };
  });
  $$("#edWinds .chip").forEach((c) => {
    c.onclick = () => {
      const d = c.dataset.wind;
      const i = st.goodWinds.indexOf(d);
      if (i >= 0) st.goodWinds.splice(i, 1);
      else st.goodWinds.push(d);
      saveState();
      renderStands();
    };
  });
  const applyCoords = () => {
    const c = parseCoords($("#edLat").value + ", " + $("#edLng").value);
    if (!c) { toast("Couldn't read those coordinates"); return; }
    st.lat = c[0];
    st.lng = c[1];
    saveState();
    renderStands();
    map.panTo([st.lat, st.lng]);
  };
  $("#edLat").onchange = applyCoords;
  $("#edLng").onchange = applyCoords;
  $("#edCopy").onclick = () => copyCoords(st.lat, st.lng);
  $("#edHere").onclick = () => {
    if (meLatLng) {
      st.lat = meLatLng[0];
      st.lng = meLatLng[1];
      saveState();
      renderStands();
      map.panTo(meLatLng);
      toast("Stand moved to your location");
    } else {
      toast("Turn on location (◎ on the map) first");
      if (!locateOn) toggleLocate();
    }
  };
  $$("#edDeer .chip").forEach((c) => {
    c.onclick = () => {
      if (!Array.isArray(st.deerDirs)) st.deerDirs = [];
      const d = c.dataset.deer;
      const i = st.deerDirs.indexOf(d);
      if (i >= 0) st.deerDirs.splice(i, 1);
      else st.deerDirs.push(d);
      saveState();
      renderStands();
    };
  });
  $("#edNotes").onchange = (e) => {
    st.notes = e.target.value;
    saveState();
  };
  $("#edDone").onclick = () => {
    editingStandId = null;
    renderStands();
    renderResearchPanel();
  };
  $("#edPan").onclick = () => {
    map.setView([st.lat, st.lng], Math.max(map.getZoom(), 16));
    if (window.matchMedia("(max-width:640px)").matches) hidePanel();
  };
  $("#edDel").onclick = () => {
    if (confirm(`Delete "${st.name}"?`)) deleteStand(st.id);
  };
  const ss = $("#edStartSit");
  if (ss) ss.onclick = (e) => { e.preventDefault(); startSit(st.id); };
}

/* ---------------------------------------------------------- panel utils -- */
function openSection(id) {
  let sec = $(`.sec[data-sec="${id}"]`);
  while (sec) {
    sec.classList.remove("collapsed");
    sec = sec.parentElement ? sec.parentElement.closest(".sec") : null;
  }
}
function hidePanel() {
  $("#app").classList.add("panel-hidden");
  setTimeout(() => map && map.invalidateSize(), 220);
}
function showPanel() {
  $("#app").classList.remove("panel-hidden");
  setTimeout(() => map && map.invalidateSize(), 220);
}

/* ------------------------------------------------------------ export/io -- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `deer-planner-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function shareData() {
  const filename = `deer-planner-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  // AirDrop only shows up via the OS share sheet — Web Share API is the one
  // way a web page can open it (no browser lets a page target AirDrop directly).
  const file = new File([blob], filename, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Deer Planner data" });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // user backed out of the share sheet
    }
  }
  // desktop / unsupported browser — just download like Export
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("AirDrop isn't available in this browser — file downloaded instead");
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const s = JSON.parse(fr.result);
      if (!s || s.version !== 1) throw new Error("bad file");
      state = s;
      if (!Array.isArray(state.signs)) state.signs = [];
      if (!Array.isArray(state.harvests)) state.harvests = [];
      if (!Array.isArray(state.tracks)) state.tracks = [];
      migrateStands(state);
      migrateSits(state);
      migrateToBoundaryModel(state);
      saveState();
      selectedStandId = null;
      editingStandId = null;
      trackingId = null;
      // rebuild map layers
      const v = state.view || { center: DEFAULT_PROPERTY.center, zoom: DEFAULT_PROPERTY.zoom };
      map.setView(v.center, v.zoom);
      recomputeActiveBoundary();
      drawnItems.clearLayers();
      pShapes().forEach(addShapeToMap);
      renderSignMarkers();
      renderHarvestMarkers();
      renderTrackLayers();
      renderAll();
      fetchWeather(true);
      toast("Imported");
    } catch (e) {
      toast("Import failed — not a Deer Planner file");
    }
  };
  fr.readAsText(file);
}

/* --------------------------------------------------------------- init --- */
const errOut = (m) => {
  if (typeof window.__dpError === "function") window.__dpError(m);
  console.error(m);
};

function init() {
  // Each stage isolated: a failure in one shouldn't blank the whole app.
  try {
    initMap();
    recomputeActiveBoundary();
  } catch (e) {
    errOut("Map failed to start: " + (e && e.message ? e.message : e));
  }
  try {
    renderAll();
    renderTrackLayers();
  } catch (e) {
    errOut("Panel failed to render: " + (e && e.message ? e.message : e));
  }
  setTimeout(() => {
    try { if (map) map.invalidateSize(); } catch (e) {}
  }, 300);

  initAddressSearch();

  $("#panelToggle").onclick = showPanel;
  // add a hide control inside panel head
  const hideBtn = document.createElement("button");
  hideBtn.className = "btn btn-ghost btn-sm";
  hideBtn.textContent = "Hide";
  hideBtn.style.cssText = "position:absolute;top:12px;right:12px";
  hideBtn.onclick = hidePanel;
  $(".panel-head").style.position = "relative";
  $(".panel-head").appendChild(hideBtn);

  $("#btnExport").onclick = exportData;
  $("#btnShare").onclick = shareData;
  $("#btnImport").onclick = () => $("#importFile").click();
  $("#importFile").onchange = (e) => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  };
  $("#photoFile").onchange = (e) => {
    const files = Array.from(e.target.files || []);
    const target = pendingPhotoPick;
    pendingPhotoPick = null;
    e.target.value = "";
    if (!files.length || !target) return;
    toast(files.length > 1 ? `Saving ${files.length} photos…` : "Saving photo…");
    Promise.all(files.map((f) => resizeImageFile(f, 1600).then((blob) => addPhoto(target.kind, target.id, blob)))).then(() => {
      toast("Saved");
      if (target.onDone) target.onDone();
    });
  };

  fetchWeather(false);
  setInterval(() => fetchWeather(false), 30 * 60 * 1000);

  // if the app's just been sitting open (backgrounded overnight, say) and a new
  // day's arrived since, jump the Hunt date forward instead of leaving it stale
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (state.settings.date && state.settings.date < todayISO()) {
      state.settings.date = todayISO();
      saveState();
      const di = $("#huntDate");
      if (di) di.value = state.settings.date;
      updateHuntMomentHint();
      renderStands();
      toast("Jumped the Hunt date to today");
    }
  });

  // keep Leaflet's own size cache honest across orientation flips and the mobile
  // browser chrome (address bar) showing/hiding, so taps land where you tapped
  window.addEventListener("resize", () => { try { map && map.invalidateSize(); } catch (e) {} });

  // restore saved terrain (the last-used area)
  if (window.DPTerrain) {
    DPTerrain.restoreFromCache()
      .then((td) => {
        refreshTerrainAreas();
        if (td) {
          refreshTerrainOverlay();
          renderStands();
          renderScoutPanel();
          updateHuntMomentHint();
        }
      })
      .catch(() => {});
  }

  /* small support/debug namespace — handy from the browser console */
  window.deerPlanner = {
    get state() { return state; },
    get map() { return map; },
    export: exportData,
    addShape(kind, latlngs, label) {
      const shape = { id: uid(), kind, latlngs, label: label || "" };
      state.shapes.push(shape);
      saveState();
      shapesChanged();
      return shape;
    },
    terrain: window.DPTerrain,
    async reset() {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem(WX_KEY);
      if (window.DPTerrain) try { await DPTerrain.clearCache(); } catch (e) {}
      location.reload();
    },
  };
}

if (document.readyState === "loading")
  document.addEventListener("DOMContentLoaded", init);
else init();
})();

</script>
</body>
</html>
