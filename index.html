/* ------------------------------------------------------------- weather --- */
let wx = null; // { ts, lat, lng, data, stale }
let wxError = null;

function wxUrl(lat, lng) {
  const p = new URLSearchParams({
    latitude: lat.toFixed(5),
    longitude: lng.toFixed(5),
    current:
      "temperature_2m,relative_humidity_2m,surface_pressure,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,precipitation",
    hourly:
      "temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,precipitation,precipitation_probability",
    daily: "sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_sum",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",
    timezone: "auto",
    past_days: "2",
    forecast_days: "3",
  });
  return "https://api.open-meteo.com/v1/forecast?" + p.toString();
}

function loadWxCache() {
  try {
    const raw = localStorage.getItem(WX_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

async function fetchWeather(force) {
  const [lat, lng] = weatherAnchor();
  const cache = loadWxCache();
  const fresh =
    cache &&
    Math.abs(cache.lat - lat) < 1e-3 &&
    Math.abs(cache.lng - lng) < 1e-3 &&
    Date.now() - cache.ts < WX_MAX_AGE_MS;

  if (cache) {
    wx = { ...cache, stale: !fresh };
    renderWeather();
    renderStands();
    updateHuntMomentHint();
  }
  if (fresh && !force) return;

  try {
    const res = await fetch(wxUrl(lat, lng), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    wx = { ts: Date.now(), lat, lng, data, stale: false };
    try {
      localStorage.setItem(WX_KEY, JSON.stringify({ ts: wx.ts, lat, lng, data }));
    } catch (e) {}
    renderWeather();
    renderStands();
    updateHuntMomentHint();
  } catch (e) {
    console.warn("weather fetch failed", e);
    wxError = location.protocol === "file:"
      ? "Weather couldn't load. If this is Safari, open the file in Chrome — Safari blocks network requests from local files."
      : "Weather couldn't load — no connection.";
    if (wx) {
      wx.stale = true;
      renderWeather();
      toast("Weather offline — showing last saved");
    } else {
      renderWeather();
      toast(wxError);
    }
  }
}

/* nearest hourly index to a Date */
function hourIndex(target) {
  const h = wx && wx.data && wx.data.hourly;
  if (!h) return -1;
  let best = -1,
    bd = Infinity;
  for (let i = 0; i < h.time.length; i++) {
    const d = Math.abs(parseWx(h.time[i]) - target);
    if (d < bd) {
      bd = d;
      best = i;
    }
  }
  return best;
}

function dailyIndexFor(dateISO) {
  const d = wx && wx.data && wx.data.daily;
  if (!d) return -1;
  const i = d.time.indexOf(dateISO);
  return i;
}

/* the representative hunt moment for the current settings */
function huntMoment() {
  const { date, window: win, customTime } = state.settings;
  const di = dailyIndexFor(date);
  const daily = wx && wx.data && wx.data.daily;
  if (win === "AM" && di >= 0 && daily) {
    return new Date(parseWx(daily.sunrise[di]).getTime() + 60 * 60000);
  }
  if (win === "PM" && di >= 0 && daily) {
    return new Date(parseWx(daily.sunset[di]).getTime() - 60 * 60000);
  }
  const [hh, mm] = (customTime || "17:00").split(":").map(Number);
  const parts = date.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2], hh || 17, mm || 0);
}

/* wind + conditions at the hunt moment */
function conditionsAtHunt() {
  if (!wx || !wx.data || !wx.data.hourly) return null;
  const t = huntMoment();
  const i = hourIndex(t);
  if (i < 0) return null;
  const h = wx.data.hourly;
  return {
    when: t,
    windFrom: h.wind_direction_10m[i],
    windMph: h.wind_speed_10m[i],
    gustMph: h.wind_gusts_10m[i],
    tempF: h.temperature_2m[i],
    precipIn: h.precipitation ? h.precipitation[i] : null,
    precipProb: h.precipitation_probability ? h.precipitation_probability[i] : null,
  };
}

/* legal shooting light — NY & IL are both 1/2 hr before sunrise / after sunset */
const LEGAL_MIN = 30;
function legalLight() {
  const di = dailyIndexFor(state.settings.date);
  const daily = wx && wx.data && wx.data.daily;
  if (di < 0 || !daily) return null;
  const sr = parseWx(daily.sunrise[di]);
  const ss = parseWx(daily.sunset[di]);
  return {
    sunrise: sr,
    sunset: ss,
    amStart: new Date(+sr - LEGAL_MIN * 60000),
    pmEnd: new Date(+ss + LEGAL_MIN * 60000),
  };
}

/* the whole sit window for the chosen date + AM/PM/custom */
function sitWindow() {
  const di = dailyIndexFor(state.settings.date);
  const daily = wx && wx.data && wx.data.daily;
  const win = state.settings.window;
  if (win === "AM" && di >= 0 && daily) {
    const sr = parseWx(daily.sunrise[di]);
    return { start: new Date(+sr - 35 * 60000), end: new Date(+sr + 150 * 60000) };
  }
  if (win === "PM" && di >= 0 && daily) {
    const ss = parseWx(daily.sunset[di]);
    return { start: new Date(+ss - 165 * 60000), end: new Date(+ss + 35 * 60000) };
  }
  const m = huntMoment();
  return { start: new Date(+m - 90 * 60000), end: new Date(+m + 90 * 60000) };
}

/* does the wind meaningfully change direction across the sit? */
function sitWindShift() {
  if (!wx || !wx.data || !wx.data.hourly) return null;
  const h = wx.data.hourly;
  const { start, end } = sitWindow();
  const i0 = hourIndex(start), i1 = hourIndex(end);
  if (i0 < 0 || i1 < 0 || i1 <= i0) return null;
  const d0 = h.wind_direction_10m[i0], d1 = h.wind_direction_10m[i1];
  const s0 = h.wind_speed_10m[i0], s1 = h.wind_speed_10m[i1];
  let maxTurn = 0;
  for (let i = i0; i <= i1; i++) maxTurn = Math.max(maxTurn, angDiff(d0, h.wind_direction_10m[i]));
  return {
    start, end,
    dirA: d0, dirB: d1, fromA: degToCompass8(d0), fromB: degToCompass8(d1),
    spdA: Math.round(s0), spdB: Math.round(s1),
    turn: Math.round(maxTurn),
    shifts: maxTurn >= 40 && angDiff(d0, d1) >= 25,
  };
}

/* rain during (or bracketing) the sit window */
function rainInSit() {
  if (!wx || !wx.data || !wx.data.hourly) return null;
  const h = wx.data.hourly;
  if (!h.precipitation) return null;
  const { start, end } = sitWindow();
  let i0 = hourIndex(start), i1 = hourIndex(end);
  if (i0 < 0) return null;
  i1 = Math.min(i1 < 0 ? i0 : i1, h.time.length - 1);
  let total = 0, firstWet = -1, maxProb = 0, anyWet = false;
  for (let i = i0; i <= i1; i++) {
    const p = h.precipitation[i] || 0;
    const pr = (h.precipitation_probability && h.precipitation_probability[i]) || 0;
    maxProb = Math.max(maxProb, pr);
    total += p;
    if (p >= 0.01 && firstWet < 0) firstWet = i;
    if (p >= 0.01) anyWet = true;
  }
  return {
    total: Math.round(total * 100) / 100,
    maxProb,
    anyWet,
    firstWet: firstWet >= 0 ? parseWx(h.time[firstWet]) : null,
  };
}

/* a plain daily-movement call from the front / temp / rut / moon / wind */
function movementOutlook() {
  if (!wx || !wx.data) return null;
  const dt = dayTemps(state.settings.date);
  const m = huntMoment();
  const tr = pressureTrend(hourIndex(m));
  const c = conditionsAtHunt();
  const notes = [];
  let score = 0;

  if (dt.todayMaxF != null && dt.yesterdayMaxF != null) {
    const drop = dt.yesterdayMaxF - dt.todayMaxF;
    if (drop >= 15) { score += 2.2; notes.push(`${Math.round(drop)}° colder than yesterday`); }
    else if (drop >= 8) { score += 1.3; notes.push(`${Math.round(drop)}° cooler than yesterday`); }
    else if (drop <= -12) { score -= 1.2; notes.push(`${Math.round(-drop)}° warmer than yesterday`); }
  }
  if (tr) {
    if (tr.dir === "rising") { score += 1; notes.push("pressure rising — front clearing out"); }
    else if (tr.dir === "falling") { score += 0.6; notes.push("pressure dropping — deer often move ahead of the weather"); }
  }
  const rp = window.DPResearch ? DPResearch.rutPhase(state.settings.date) : null;
  if (rp && /chase|seek|peak|rut|lockdown/i.test(rp.label)) {
    score += /peak|chase|seek/i.test(rp.label) ? 1.8 : 0.6;
    notes.push("rut: " + rp.label.toLowerCase());
  }
  if (c) {
    if (c.windMph >= 22) { score -= 1.6; notes.push(`wind ${Math.round(c.windMph)} mph — deer hold tight`); }
    else if (c.windMph <= 3) { score -= 0.3; notes.push("near calm — swirling scent"); }
    if (c.tempF != null && c.tempF >= 70) { score -= 1; notes.push("warm for movement"); }
  }
  const rain = rainInSit();
  if (rain && rain.anyWet) {
    if (rain.total >= 0.3) { score -= 1; notes.push(`rain in the sit (${rain.total}")`); }
    else notes.push("light rain possible — deer often move right after");
  }

  const rating = score >= 3 ? "Prime" : score >= 1.5 ? "Good" : score >= 0.2 ? "Fair" : "Slow";
  return { rating, score, notes };
}

function pressureTrend(atIdx) {
  if (!wx || !wx.data || !wx.data.hourly) return null;
  const h = wx.data.hourly;
  const i = atIdx == null ? hourIndex(new Date()) : atIdx;
  if (i < 6) return null;
  const p0 = h.pressure_msl[i];
  const p6 = h.pressure_msl[i - 6];
  if (p0 == null || p6 == null) return null;
  const d = p0 - p6;
  const dir = d > 1.5 ? "rising" : d < -1.5 ? "falling" : "steady";
  return { deltaHpa: d, dir, nowHpa: p0 };
}

function dayTemps(dateISO) {
  const dl = wx && wx.data && wx.data.daily;
  if (!dl || !dl.temperature_2m_max) return {};
  const di = dl.time.indexOf(dateISO);
  if (di < 0) return {};
  const T = dl.temperature_2m_max;
  return {
    todayMaxF: T[di],
    yesterdayMaxF: di >= 1 ? T[di - 1] : null,
    prior2MaxF: di >= 2 ? T[di - 2] : null,
    tomorrowMaxF: di + 1 < T.length ? T[di + 1] : null,
  };
}

function minsFromCrepuscular() {
  const di = dailyIndexFor(state.settings.date);
  const daily = wx && wx.data && wx.data.daily;
  if (di < 0 || !daily) return 999;
  const m = huntMoment();
  const sr = parseWx(daily.sunrise[di]);
  const ss = parseWx(daily.sunset[di]);
  return Math.min(Math.abs(m - sr), Math.abs(m - ss)) / 60000;
}

/* current preset weights, or custom overrides */
function scoringWeights() {
  const s = state.settings;
  if (s.weights) return { weights: s.weights, windModel: s.windModel || "pennstate" };
  return window.DPResearch
    ? DPResearch.presetWeights(s.preset || "balanced")
    : { weights: {}, windModel: "pennstate" };
}

/* ------------------------------------------------------------- scoring --- */
/* Increment C: scent fitness (spine) + a research-weighted set of movement
   drivers (see research.js). Every contribution is shown with its citation. */
function huntPhase() {
  if (state.settings.window === "AM") return "am";
  if (state.settings.window === "PM") return "pm";
  const hh = Number((state.settings.customTime || "17:00").split(":")[0]);
  return hh < 12 ? "am" : "pm";
}

/* ---- hunting pressure / stand rest ---- */
const REST_BY_DAY = [-30, -22, -15, -10, -6, -3, -1]; // days ago 0..6, then 0
const SEVERITY = { light: 0.4, medium: 0.7, heavy: 1 };

function daysBetween(aISO, bISO) {
  const a = new Date(aISO + "T00:00:00");
  const b = new Date(bISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function humanAgo(d) {
  return d <= 0 ? "earlier today" : d === 1 ? "yesterday" : `${d} days ago`;
}

function computeRest(st, dateISO, huntWin) {
  const rows = (state.sits || []).filter((s) => s.standId === st.id);
  if (state.activeSit && state.activeSit.standId === st.id) rows.push(state.activeSit);
  const items = [];
  for (const s of rows) {
    let d0 = daysBetween(s.date, dateISO);
    if (d0 < 0) continue; // sit is after the hunt date
    if (d0 === 0) {
      // same calendar day: only counts if that sit was an earlier window
      const order = { AM: 0, DAY: 1, CUSTOM: 1, PM: 2 };
      const so = order[s.window] == null ? 1 : order[s.window];
      const ho = order[huntWin] == null ? 1 : order[huntWin];
      if (so >= ho) continue;
    }
    let sev;
    if (s.type === "pressure") sev = SEVERITY[s.severity] || 0.7;
    else sev = (s.obs || []).some((o) => o.behavior === "spooked") ? 1.25 : 1;
    const per = (REST_BY_DAY[Math.min(d0, 6)] || 0) * sev;
    if (per < 0) items.push({ d0, per, s });
  }
  if (!items.length)
    return { raw: 0, text: "No recent sits or pressure logged here", daysAgo: null, n: 0 };
  items.sort((a, b) => a.per - b.per);
  let raw = items[0].per;
  for (let i = 1; i < items.length; i++) raw += items[i].per * 0.4;
  raw = Math.max(-42, Math.round(raw));

  const worst = items[0];
  const kind = worst.s.type === "pressure" ? "Pressure here" : "You hunted here";
  const more = items.length > 1 ? ` (+${items.length - 1} more in the last week)` : "";
  const verdict =
    raw <= -24 ? "let it rest several more days" :
    raw <= -12 ? "give it another day or two" :
    raw <= -5 ? "nearly rested" : "rested";
  return {
    raw,
    text: `${kind} ${humanAgo(worst.d0)}${more} — ${verdict}`,
    daysAgo: worst.d0,
    n: items.length,
  };
}

/* one deer-approach direction vs. the scent drift */
function deerDirBase(scentFrom, dir, src) {
  const off = angDiff(scentFrom, dirToDeg(dir));
  if (off <= 25) return { base: 100, t: `${src} blows straight from the ${dir} deer to you`, cls: "plus" };
  if (off <= 50) return { base: 84, t: `${src} favors you for ${dir} deer`, cls: "plus" };
  if (off <= 75) return { base: 62, t: `${src} quarters past ${dir} deer — marginal`, cls: "" };
  if (off <= 100) return { base: 44, t: `${src} crosses past ${dir} deer`, cls: "" };
  if (off <= 140) return { base: 22, t: `${src} drifts toward ${dir} deer`, cls: "minus" };
  return { base: 6, t: `${src} carries right to ${dir} deer`, cls: "minus" };
}
function deerDirsOf(st) {
  return st.deerDirs && st.deerDirs.length ? st.deerDirs : st.deerDir ? [st.deerDir] : [];
}

/* scent fitness 0..100 from effective (wind+thermal) drift vs the setup */
function scentFitness(st, c, phase) {
  const factors = [];
  let scentFrom = c.windFrom;
  let eff = null;
  if (window.DPTerrain && DPTerrain.current) {
    eff = DPTerrain.effectiveWind(st.lat, st.lng, c.windFrom, c.windMph, phase);
    if (eff) scentFrom = eff.fromDeg;
  }
  const scentC = degToCompass8(scentFrom);
  const usingThermal = eff && eff.thermalShare >= 0.15;
  let base;

  const dDirs = deerDirsOf(st);
  if (dDirs.length) {
    const src = usingThermal ? "Scent drift" : `Wind from ${scentC}`;
    const evals = dDirs.map((d) => deerDirBase(scentFrom, d, src));
    const worst = evals.reduce((a, b) => (b.base < a.base ? b : a));
    base = worst.base;
    factors.push({
      t: worst.t + (dDirs.length > 1 ? ` — worst of ${dDirs.join("/")}` : ""),
      cls: worst.cls,
    });
  } else if (st.goodWinds && st.goodWinds.length) {
    const nb = neighbors8(scentC);
    const kind = usingThermal ? "drift" : "wind";
    if (st.goodWinds.includes(scentC)) { base = 90; factors.push({ t: `${scentC} ${kind} is on this stand's good list`, cls: "plus" }); }
    else if (nb.some((d) => st.goodWinds.includes(d))) { base = 62; factors.push({ t: `${scentC} ${kind} is next to a good wind — usable`, cls: "" }); }
    else if (st.goodWinds.some((d) => oppositeDir(d) === scentC)) { base = 12; factors.push({ t: `${scentC} ${kind} is opposite this stand's good winds`, cls: "minus" }); }
    else { base = 30; factors.push({ t: `${scentC} ${kind} is off this stand's good winds`, cls: "minus" }); }
  } else {
    base = 50;
    factors.push({ t: "Set a deer direction or good winds for a real scent score", cls: "" });
  }

  if (usingThermal) {
    factors.push({
      t: `${eff.note} — raw wind ${degToCompass8(c.windFrom)} ${Math.round(c.windMph)} mph is only ${Math.round((1 - eff.thermalShare) * 100)}% of the drift here`,
      cls: "minus",
    });
  }
  if (c.gustMph - c.windMph > 12) {
    base -= 6;
    factors.push({ t: `Gusts to ${Math.round(c.gustMph)} mph — swirl risk`, cls: "minus" });
  }
  return { base: clamp(base, 0, 100), factors, scentC, usingThermal };
}

function buildScoreContext(st) {
  const c = conditionsAtHunt();
  if (!c || !window.DPResearch) return null;
  const phase = huntPhase();
  const m = huntMoment();
  const hi = hourIndex(m);
  const tr = pressureTrend(hi);
  const dt = dayTemps(state.settings.date);
  const dObj = new Date(state.settings.date + "T12:00:00");

  let terrain = null,
    movement = null;
  if (window.DPTerrain && DPTerrain.current) {
    const s = DPTerrain.sampleAt(st.lat, st.lng);
    if (s) {
      terrain = { landform: s.landform, funnel: s.funnel, slopeDeg: s.slopeDeg, aspectDeg: s.aspectDeg };
      if (DPTerrain.movementAt) movement = DPTerrain.movementAt(st.lat, st.lng, phase);
    }
  }

  return {
    date: state.settings.date,
    month: dObj.getMonth(),
    phase,
    huntHour: hourAtProperty(m),
    minsFromCrepuscular: minsFromCrepuscular(),
    windFromDeg: c.windFrom,
    windMph: c.windMph,
    gustMph: c.gustMph,
    tempF: c.tempF,
    todayMaxF: dt.todayMaxF,
    yesterdayMaxF: dt.yesterdayMaxF,
    prior2MaxF: dt.prior2MaxF,
    tomorrowMaxF: dt.tomorrowMaxF,
    pressInHg: tr ? hpaToInHg(tr.nowHpa) : null,
    pressTrendHpa6: tr ? tr.deltaHpa : null,
    lat: st.lat,
    lng: st.lng,
    terrain,
    movement,
    LF: window.DPTerrain ? DPTerrain.LF : { SADDLE: 6, DRAW: 1, BENCH: 3, SPUR: 4, RIDGE: 5, STEEP: 7, BOTTOM: 0, FLAT: 8, SLOPE: 2 },
    moon: DPResearch.moonInfo(state.settings.date, hourAtProperty(m)),
    windModel: (state.settings.windModel || "pennstate"),
    rest: computeRest(st, state.settings.date, state.settings.window),
  };
}

function scoreStand(st) {
  const c = conditionsAtHunt();
  if (!c) return { score: null, factors: [{ t: "Waiting on weather data", cls: "" }] };

  const phase = huntPhase();
  const fit = scentFitness(st, c, phase);
  const factors = fit.factors.slice();

  const ctx = buildScoreContext(st);
  let ev = null;
  if (ctx) {
    const { weights } = scoringWeights();
    ev = DPResearch.evaluateAll(ctx, weights);
    ev.drivers
      .filter((d) => !d.na && Math.abs(d.weighted) >= 0.4)
      .sort((a, b) => Math.abs(b.weighted) - Math.abs(a.weighted))
      .forEach((d) =>
        factors.push({
          t: `${d.name}: ${d.text}  (${d.weighted > 0 ? "+" : ""}${d.weighted})`,
          cls: d.cls,
        })
      );
    if (!window.DPTerrain || !DPTerrain.current)
      factors.push({ t: "Load terrain for thermal + landform scoring", cls: "" });
  }

  const dayMod = ev ? ev.dayMod : 0;
  const spotMod = ev ? ev.spotMod : 0;
  const restMod = ev ? ev.restMod : 0;
  const score = Math.round(clamp(fit.base + dayMod + spotMod + restMod, 0, 100));
  return { score, factors, cond: c, ev, fit, dayMod, spotMod, restMod, rest: ctx ? ctx.rest : null };
}

/* one-paragraph "shows its work" recommendation */
function recommendationText(st) {
  const r = scoreStand(st);
  if (r.score == null) return "Waiting on weather data.";
  const bits = [];
  const scentLead = r.fit.factors[0] ? r.fit.factors[0].t : "";
  bits.push(scentLead + ` (scent fitness ${Math.round(r.fit.base)})`);
  if (r.ev) {
    if (r.restMod <= -4 && r.rest) bits.push("− " + r.rest.text);
    if (r.ev.rut && r.ev.rut.move > 0) {
      const rd = r.ev.drivers.find((d) => d.id === "rut");
      if (rd && !rd.na) bits.push(rd.text);
    }
    r.ev.drivers
      .filter((d) => !d.na && d.id !== "rut" && d.id !== "huntPressure" && Math.abs(d.weighted) >= 0.8)
      .sort((a, b) => Math.abs(b.weighted) - Math.abs(a.weighted))
      .slice(0, 4)
      .forEach((d) => bits.push((d.weighted > 0 ? "+ " : "− ") + d.text));
  }
  let out = bits.join(". ") + ".";
  // if this spot is rest-penalized, name a better-rested alternative
  if (r.restMod <= -8) {
    const alt = bestAlternative(st);
    if (alt) out += ` Better rested option: ${alt.name} (${alt.score}).`;
  }
  return out;
}

function bestAlternative(exclude) {
  let best = null;
  for (const s of pStands()) {
    if (s.id === exclude.id) continue;
    const r = scoreStand(s);
    if (r.score == null) continue;
    if (r.restMod < -6) continue; // also pressured — skip
    if (!best || r.score > best.score) best = { name: s.name, score: r.score, id: s.id };
  }
  return best;
}

/* ---- reliability: how many winds a stand plays on ---- */
function standReliability(st) {
  if (!deerDirsOf(st).length && (!st.goodWinds || !st.goodWinds.length))
    return { label: "Not set", note: "Set a deer direction or good winds to rate this stand.", perDir: [], solid: [], floor: null };

  const speeds = [5, 11]; // thermal-prone + wind-dominant
  const phases = ["am", "pm"];
  const perDir = DIRS8.map((d, di) => {
    let minFit = 100;
    for (const ph of phases)
      for (const sp of speeds) {
        const c = { windFrom: di * 45, windMph: sp, gustMph: sp + 4, tempF: 55 };
        const f = scentFitness(st, c, ph).base;
        if (f < minFit) minFit = f;
      }
    return { dir: d, fit: Math.round(minFit) };
  });
  const solid = perDir.filter((p) => p.fit >= 70).map((p) => p.dir);
  const usable = perDir.filter((p) => p.fit >= 48).map((p) => p.dir);
  const floor = Math.min.apply(null, perDir.map((p) => p.fit));
  let label;
  if (solid.length >= 6) label = "Anchor";
  else if (solid.length >= 4) label = "Solid";
  else if (solid.length >= 2 || usable.length >= 5) label = "Situational";
  else label = "One-wind";
  const note =
    label === "Anchor"
      ? "Plays on most winds — worth a permanent set and cut shooting lanes."
      : label === "Solid"
      ? "Good on several winds — a dependable stand."
      : label === "Situational"
      ? "Wind-restricted — hunt it when conditions line up."
      : "One-wind spot — hang-and-hunt it, don't invest a permanent set.";
  return { label, note, perDir, solid, usable, floor };
}
const RELIA_CLASS = { Anchor: "g", Solid: "g", Situational: "m", "One-wind": "b", "Not set": "n" };

const scoreClass = (s) => (s == null ? "n" : s >= 70 ? "g" : s >= 45 ? "m" : "b");

/* does this stand go good→bad (or bad→good) as the wind clocks over the sit? */
function standSitTrend(st) {
  const sh = sitWindShift();
  if (!sh || !sh.shifts) return null;
  const ph = huntPhase();
  const mk = (dir, spd) => ({ windFrom: dir, windMph: spd, gustMph: spd + 4, tempF: 55 });
  const fa = scentFitness(st, mk(sh.dirA, sh.spdA), ph).base;
  const fb = scentFitness(st, mk(sh.dirB, sh.spdB), ph).base;
  if (fa >= 58 && fb <= 42)
    return { drop: true, short: "sours late", text: `wind clocks ${sh.fromA}→${sh.fromB} — this stand goes bad mid-sit` };
  if (fb >= 58 && fa <= 42)
    return { drop: false, short: "better late", text: `wind swings ${sh.fromA}→${sh.fromB} — this stand comes on later in the sit` };
  return null;
}

/* ----------------------------------------------------------------- map --- */
let map, drawnItems, layerObjs = {}, standMarkers = {}, signMarkers = {}, harvestMarkers = {};
let selectedStandId = null;
let editingStandId = null; // which stand's full editor is expanded
let placing = null; // { kind:'stand'|'sign'|'harvest', type?:string }

const HARVEST_SEX = [
  ["buck", "Buck"],
  ["doe", "Doe"],
  ["button", "Button buck"],
  ["fawn", "Fawn"],
];

/* field-sign types */
const SIGN_TYPES = [
  { key: "rub", label: "Rub", letter: "R", color: "#c8863f" },
  { key: "scrape", label: "Scrape", letter: "S", color: "#b0553f" },
  { key: "bedding", label: "Bedding", letter: "B", color: "#5aa15a" },
  { key: "trail", label: "Trail / track", letter: "T", color: "#9a8" },
  { key: "camera", label: "Camera", letter: "C", color: "#4a9eff" },
  { key: "other", label: "Other", letter: "•", color: "#c9d2da" },
];
const signDef = (t) => SIGN_TYPES.find((s) => s.key === t) || SIGN_TYPES[5];

function initMap() {
  const { center, zoom } = state.view || { center: DEFAULT_PROPERTY.center, zoom: DEFAULT_PROPERTY.zoom };
  map = L.map("map", { center, zoom, zoomControl: false, fadeAnimation: false });
  L.control.zoom({ position: "topright" }).addTo(map);
  L.control.scale({ imperial: true, metric: false, position: "bottomright" }).addTo(map);

  Object.entries(BASE_LAYERS).forEach(([name, def]) => {
    const ly = new OfflineTileLayer(def.url, def.opts);
    ly._dpName = name;
    ly.on("tileunload", (e) => {
      if (e.tile && e.tile.src && e.tile.src.indexOf("blob:") === 0) {
        try { URL.revokeObjectURL(e.tile.src); } catch (err) {}
      }
    });
    layerObjs[name] = ly;
  });
  (layerObjs[state.settings.layer] || layerObjs.Satellite).addTo(map);
  L.control.layers(layerObjs, {}, { position: "topright" }).addTo(map);

  map.on("baselayerchange", (e) => {
    state.settings.layer = e.name;
    saveState();
  });
  map.on("moveend", () => {
    state.view = { center: [map.getCenter().lat, map.getCenter().lng], zoom: map.getZoom() };
    saveState();
    if (recomputeActiveBoundary()) onActiveAreaChanged();
  });

  drawnItems = L.featureGroup().addTo(map);
  map.on(L.Draw.Event.CREATED, onDrawCreated);

  map.on("click", (e) => {
    if (movingPin) {
      finalizeMovePin(e.latlng.lat, e.latlng.lng);
      return;
    }
    if (placing) {
      finalizePlace(e.latlng.lat, e.latlng.lng);
      return;
    }
    if (measure) {
      addMeasurePoint(e.latlng);
      return;
    }
    if (cornerEd && cornerEd.tapMode) {
      cornerEd.verts.push([e.latlng.lat, e.latlng.lng]);
      renderMapTools();
      refreshCornerEdit();
      return;
    }
    if (window.DPTerrain && DPTerrain.current) terrainReadoutPopup(e.latlng);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && movingPin) cancelMovePin();
    else if (e.key === "Escape" && placing) cancelPlace();
    else if (e.key === "Escape" && measure) stopMeasure();
  });
  map.on("popupclose", () => closeHarvestTips());

  map.addControl(new LocateControl());
  map.addControl(new AddControl());
  map.addControl(new RulerControl());
  map.addControl(new WalkControl());
  map.addControl(new TrailVisControl());
  coordCtl = new CoordControl();
  map.addControl(coordCtl);
  map.on("mousemove", (e) => coordCtl.set(e.latlng));
  map.on("click", (e) => coordCtl.set(e.latlng));
  map.on("click", () => {
    const w = document.querySelector(".dp-add-wrap.open");
    if (w) w.classList.remove("open");
  });

  pShapes().forEach(addShapeToMap);
  renderStandMarkers();
  renderSignMarkers();
  renderHarvestMarkers();
}

/* ---- placing new stands / signs / harvests ---- */
function beginPlace(kind, type) {
  if (measure) stopMeasure();
  if (movingPin) cancelMovePin();
  placing = { kind, type: type || null };
  document.body.style.cursor = "crosshair";
  const what =
    kind === "stand" ? "stand" :
    kind === "harvest" ? "harvested deer" :
    kind === "shot" ? "shot spot" :
    kind === "blood" ? "blood mark" :
    signDef(type).label.toLowerCase();
  toast(`Placing a ${what} — tap the map, or use “here” / paste coords (Esc cancels)`);
  renderStands();
  renderSignsPanel();
  renderHarvestPanel();
  renderRecoveryPanel();
  if (window.matchMedia("(max-width:640px)").matches) hidePanel();
}
function cancelPlace() {
  placing = null;
  document.body.style.cursor = "";
  renderStands();
  renderSignsPanel();
  renderHarvestPanel();
  renderRecoveryPanel();
  toast("Cancelled");
}
function finalizePlace(lat, lng) {
  if (!placing) return;
  const p = placing;
  placing = null;
  document.body.style.cursor = "";
  if (p.kind === "stand") createStand(lat, lng);
  else if (p.kind === "harvest") createHarvest(lat, lng);
  else if (p.kind === "shot") setShotSpot(lat, lng);
  else if (p.kind === "blood") addBloodMark(lat, lng, p.last);
  else createSign(p.type, lat, lng);
}

/* ---- moving an existing stand / sign — only ever starts from an explicit
   "Move" button, never from touching the pin itself, so a plain tap can't
   drag anything by accident. Tap Move, then tap the map where it should go. */
let movingPin = null; // { kind:'stand'|'sign', id }
function movingPinMarker() {
  if (!movingPin) return null;
  return movingPin.kind === "stand" ? standMarkers[movingPin.id] : signMarkers[movingPin.id];
}
function beginMovePin(kind, id) {
  if (movingPin) cancelMovePin();
  movingPin = { kind, id };
  document.body.style.cursor = "crosshair";
  const mk = movingPinMarker();
  const el = mk && mk.getElement();
  if (el) el.classList.add("marker-armed");
  toast("Tap the map where it should go (Esc cancels)");
  if (window.matchMedia("(max-width:640px)").matches) hidePanel();
}
function cancelMovePin() {
  const mk = movingPinMarker();
  const el = mk && mk.getElement();
  if (el) el.classList.remove("marker-armed");
  movingPin = null;
  document.body.style.cursor = "";
}
function finalizeMovePin(lat, lng) {
  if (!movingPin) return;
  const { kind, id } = movingPin;
  cancelMovePin();
  if (kind === "stand") {
    const st = state.stands.find((s) => s.id === id);
    if (!st) return;
    st.lat = lat;
    st.lng = lng;
    saveState();
    renderStandMarkers();
    renderStands();
  } else {
    const sg = (state.signs || []).find((s) => s.id === id);
    if (!sg) return;
    sg.lat = lat;
    sg.lng = lng;
    saveState();
    renderSignMarkers();
    renderSignsPanel();
  }
  toast("Moved");
}

/* accept "38.93, -88.96", "38.93 -88.96", "N38.93 W88.96", basic DMS */
function parseCoords(str) {
  if (!str) return null;
  str = str.trim();
  let dms = str.match(
    /(\d+)[°:\s]+(\d+)['′:\s]+([\d.]+)["″]?\s*([NSns])[,\s]+(\d+)[°:\s]+(\d+)['′:\s]+([\d.]+)["″]?\s*([EWew])/
  );
  if (dms) {
    let lat = +dms[1] + +dms[2] / 60 + +dms[3] / 3600;
    let lng = +dms[5] + +dms[6] / 60 + +dms[7] / 3600;
    if (/[Ss]/.test(dms[4])) lat = -lat;
    if (/[Ww]/.test(dms[8])) lng = -lng;
    return valid(lat, lng);
  }
  const m = str.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if (m) {
    let lat = +m[1],
      lng = +m[2];
    if (/[Ss]/.test(str) && lat > 0) lat = -lat;
    if (/[Ww]/.test(str) && lng > 0) lng = -lng;
    return valid(lat, lng);
  }
  return null;
  function valid(la, ln) {
    if (Math.abs(la) > 90 || Math.abs(ln) > 180 || isNaN(la) || isNaN(ln)) return null;
    return [la, ln];
  }
}

function copyCoords(lat, lng) {
  const t = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(() => toast("Copied " + t), () => toast(t));
  else toast(t);
}

/* ---- geolocation ("where am I") ---- */
let meLatLng = null,
  meAcc = 0,
  meMarker = null,
  meCircle = null,
  geoWatch = null,
  geoTimer = null,
  geoHiAcc = false, // high accuracy only while placing / blood-tracking (saves battery)
  locateOn = false;

function meIcon() {
  return L.divIcon({ className: "", html: `<div class="me-dot"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] });
}
function updateMe(pos) {
  meLatLng = [pos.coords.latitude, pos.coords.longitude];
  meAcc = pos.coords.accuracy || 0;
  if (!meMarker) {
    meMarker = L.marker(meLatLng, { icon: meIcon(), zIndexOffset: 2000, title: "Tap for a 20-sec scent check" }).addTo(map);
    meMarker.on("click", () => {
      // placing a stand/sign/harvest wins — tapping your own dot drops it right there
      if (placing && meLatLng) { finalizePlace(meLatLng[0], meLatLng[1]); return; }
      if (measure && meLatLng) { addMeasurePoint(L.latLng(meLatLng[0], meLatLng[1])); return; }
      if (meLatLng) showScent(meLatLng[0], meLatLng[1]);
    });
    meCircle = L.circle(meLatLng, { radius: meAcc, color: "#4a9eff", weight: 1, fillColor: "#4a9eff", fillOpacity: 0.12, interactive: false }).addTo(map);
  } else {
    meMarker.setLatLng(meLatLng);
    meCircle.setLatLng(meLatLng).setRadius(meAcc);
  }
  const btn = $(".dp-locate");
  if (btn) btn.classList.add("has-fix");
  if (typeof trackTick === "function") trackTick(meLatLng[0], meLatLng[1], meAcc);
  if (typeof walkTrackTick === "function") walkTrackTick(meLatLng[0], meLatLng[1]);
  if (typeof navTick === "function") navTick(meLatLng[0], meLatLng[1]);
}

/* auto–shut GPS off after a while so a long sit doesn't drain the phone */
function armGpsTimer() {
  clearTimeout(geoTimer);
  const min = state.settings.gpsAutoOffMin;
  if (!min || trackingId || walkRec || navTarget) return; // 0 = never; never time out mid–blood-trail, mid-walk, or mid-navigate
  geoTimer = setTimeout(() => {
    if (locateOn && !trackingId) {
      toggleLocate();
      toast("GPS off to save battery — tap ◎ to turn it back on");
    }
  }, min * 60000);
}
function bumpGpsTimer() { if (locateOn) armGpsTimer(); }

function startLocate(recenter) {
  if (!navigator.geolocation) {
    toast("This device has no location service");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (p) => {
      updateMe(p);
      if (recenter) map.setView(meLatLng, Math.max(map.getZoom(), 16));
    },
    (e) => toast("Location " + (e.code === 1 ? "permission denied" : "unavailable")),
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 4000 }
  );
  restartWatch();
  armGpsTimer();
}
function restartWatch() {
  if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch);
  geoWatch = navigator.geolocation.watchPosition(updateMe, () => {}, {
    enableHighAccuracy: geoHiAcc,
    maximumAge: geoHiAcc ? 2000 : 8000,
  });
}
function setGpsHiAcc(on) {
  on = !!on;
  if (on === geoHiAcc) return;
  geoHiAcc = on;
  if (geoWatch != null) restartWatch();
}
function stopLocate() {
  clearTimeout(geoTimer);
  geoTimer = null;
  if (geoWatch != null) {
    navigator.geolocation.clearWatch(geoWatch);
    geoWatch = null;
  }
  if (meMarker) {
    map.removeLayer(meMarker);
    map.removeLayer(meCircle);
    meMarker = meCircle = null;
  }
  meLatLng = null;
  if (typeof clearScent === "function") clearScent();
  if (walkRec) stopWalkTrack(); // can't record a walk without GPS
  if (navTarget) stopNavTo(); // can't navigate without GPS
}
function toggleLocate() {
  locateOn = !locateOn;
  const btn = $(".dp-locate");
  if (locateOn) {
    startLocate(true);
    if (btn) btn.classList.add("on");
  } else {
    stopLocate();
    if (btn) btn.classList.remove("on", "has-fix");
  }
}
function placeAtMe() {
  if (!placing) return;
  if (meLatLng) {
    finalizePlace(meLatLng[0], meLatLng[1]);
  } else {
    toast("Getting your location…");
    if (!locateOn) toggleLocate();
    navigator.geolocation.getCurrentPosition(
      (p) => {
        updateMe(p);
        finalizePlace(p.coords.latitude, p.coords.longitude);
      },
      (e) => toast("Location " + (e.code === 1 ? "denied" : "unavailable")),
      { enableHighAccuracy: true, timeout: 12000 }
    );
  }
}

const LocateControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {
    const b = L.DomUtil.create("button", "dp-locate");
    b.type = "button";
    b.title = "My location";
    b.innerHTML = "◎";
    L.DomEvent.on(b, "click", L.DomEvent.stop).on(b, "click", () => { bumpGpsTimer(); toggleLocate(); });
    return b;
  },
});

/* ---- walk-track — a live yellow breadcrumb while you're scouting on foot ---- */
let walkRec = null; // { pts: [L.LatLng], line, label }

function walkTrackDistance(pts) {
  let t = 0;
  for (let i = 1; i < pts.length; i++) t += map.distance(pts[i - 1], pts[i]);
  return t;
}
function walkTrackTick(lat, lng) {
  if (!walkRec) return;
  const ll = L.latLng(lat, lng);
  const last = walkRec.pts[walkRec.pts.length - 1];
  if (last && map.distance(last, ll) < 5) return; // ignore GPS jitter
  walkRec.pts.push(ll);
  if (walkRec.line) map.removeLayer(walkRec.line);
  if (walkRec.label) map.removeLayer(walkRec.label);
  if (walkRec.pts.length > 1) {
    walkRec.line = L.polyline(walkRec.pts, { color: "#ffd24a", weight: 4, opacity: 0.9, interactive: false }).addTo(map);
    walkRec.label = L.marker(ll, {
      interactive: false, zIndexOffset: 1500,
      icon: L.divIcon({ className: "", html: `<div class="measure-total">${fmtDist(walkTrackDistance(walkRec.pts))}</div>`, iconSize: [1, 1] }),
    }).addTo(map);
  }
}
function startWalkTrack() {
  if (walkRec) return;
  walkRec = { pts: [], line: null, label: null };
  if (!locateOn) toggleLocate();
  else armGpsTimer(); // (re)claims the GPS timeout exemption now that walkRec exists
  const btn = $(".dp-walk");
  if (btn) btn.classList.add("on");
  toast("Recording your track — walk, tap the trail button again to save it");
}
function stopWalkTrack() {
  if (!walkRec) return;
  const pts = walkRec.pts;
  if (walkRec.line) map.removeLayer(walkRec.line);
  if (walkRec.label) map.removeLayer(walkRec.label);
  const btn = $(".dp-walk");
  if (btn) btn.classList.remove("on");
  walkRec = null;
  if (pts.length < 2) { toast("Track too short — not saved"); return; }
  if (!confirm(`Save this ${fmtDist(walkTrackDistance(pts))} walked trail?`)) return;
  const label = prompt("Label for this trail:", "Walked trail " + todayISO());
  const shape = { id: uid(), kind: "trail", latlngs: pts.map((p) => [p.lat, p.lng]), label: label || "Walked trail" };
  state.shapes.push(shape);
  saveState();
  shapesChanged();
  toast("Trail saved");
}

const WalkControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {
    const b = L.DomUtil.create("button", "dp-ctl dp-walk");
    b.type = "button";
    b.title = "Record a walked trail";
    b.innerHTML =
      `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block"><path fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3.2" d="M4 19 C8 11 11 17 20 5"/><circle cx="20" cy="5" r="2" fill="#333"/></svg>`;
    L.DomEvent.on(b, "click", L.DomEvent.stop).on(b, "click", () => (walkRec ? stopWalkTrack() : startWalkTrack()));
    return b;
  },
});

/* ---- one-tap show/hide for saved trails — a visibility toggle, not delete ---- */
let trailVisBtnEl = null;
function trailsVisible() {
  return state.settings.showTrails !== false;
}
function paintTrailVisBtn() {
  if (!trailVisBtnEl) return;

    ? `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block"><path fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3.2" d="M4 19 C8 11 11 17 20 5"/><circle cx="20" cy="5" r="2" fill="#333"/></svg>`
    : `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block"><path fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3.2" d="M4 19 C8 11 11 17 20 5"/><circle cx="20" cy="5" r="2" fill="#aaa"/><line x1="3" y1="3" x2="21" y2="21" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}
function toggleTrailVis() {

  drawnItems.clearLayers();

}
const TrailVisControl = L.Control.extend({

/* ---- "Go to" — live distance + compass arrow from your GPS to a chosen stand ---- */
let navTarget = null; // { standId, lat, lng, name, line }
let navHeading = null; // device compass heading in degrees, if granted
let navHeadingHandler = null;
let navHudEl = null;

function startHeadingWatch() {
  if (navHeadingHandler) return;
  navHeadingHandler = (e) => {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading; // true heading on iOS Safari
    else if (e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360; // best-effort elsewhere
    if (h != null) { navHeading = h; updateNavHud(); }
  };
  const attach = () => window.addEventListener("deviceorientation", navHeadingHandler, true);
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then((r) => { if (r === "granted") attach(); }).catch(() => {});
    } else {
      attach();
    }
  } catch (e) {}
}
function stopHeadingWatch() {
  if (navHeadingHandler) { try { window.removeEventListener("deviceorientation", navHeadingHandler, true); } catch (e) {} navHeadingHandler = null; }
  navHeading = null;
}

function buildNavHud() {
  if (navHudEl) return;
  const d = document.createElement("div");
  d.className = "nav-compass";
  d.innerHTML = `
    <svg viewBox="0 0 100 100" width="76" height="76">
      <circle cx="50" cy="50" r="46" fill="rgba(20,24,28,.92)" stroke="#5fd08a" stroke-width="2"/>
      <text x="50" y="15" text-anchor="middle" fill="#8ee6b0" font-size="11" font-weight="800">N</text>
      <g id="navArrowG"><polygon points="50,18 43,58 50,50 57,58" fill="#5fd08a"/></g>
    </svg>
    <div class="nav-compass-info">
      <div class="nav-compass-dist" id="navDist">locating…</div>
      <div class="nav-compass-name" id="navName"></div>
      <button type="button" class="btn btn-sm btn-ghost" id="navStopBtn">Stop</button>
    </div>`;
  document.body.appendChild(d);
  d.querySelector("#navStopBtn").onclick = () => stopNavTo();
  navHudEl = d;
}
function removeNavHud() {
  if (navHudEl) { navHudEl.remove(); navHudEl = null; }
}
function updateNavHud() {
  if (!navTarget || !navHudEl) return;
  const nameEl = $("#navName"), distEl = $("#navDist"), g = $("#navArrowG");
  if (nameEl) nameEl.textContent = navTarget.name;
  if (!meLatLng) { if (distEl) distEl.textContent = "locating…"; return; }
  const brg = bearingDeg(meLatLng[0], meLatLng[1], navTarget.lat, navTarget.lng);
  const distM = map.distance(meLatLng, [navTarget.lat, navTarget.lng]);
  if (distEl) distEl.textContent = fmtDist(distM);
  const rel = navHeading != null ? (brg - navHeading + 360) % 360 : brg;
  if (g) g.setAttribute("transform", `rotate(${rel} 50 50)`);
}

function navTick(lat, lng) {
  if (!navTarget) return;
  const from = L.latLng(lat, lng);
  const to = L.latLng(navTarget.lat, navTarget.lng);
  const distM = map.distance(from, to);
  if (navTarget.line) map.removeLayer(navTarget.line);
  navTarget.line = L.polyline([from, to], { color: "#5fd08a", weight: 3, dashArray: "2 9", interactive: false }).addTo(map);
  updateNavHud();
  if (distM < 15) {
    toast(`You've arrived at ${navTarget.name}`);
    stopNavTo();
  }
}
function startNavTo(lat, lng, name, standId) {
  if (navTarget && navTarget.standId === standId) { stopNavTo(); return; }
  if (navTarget) stopNavTo();
  navTarget = { standId, lat, lng, name, line: null };
  if (!locateOn) toggleLocate();
  else armGpsTimer();
  buildNavHud();
  startHeadingWatch();
  toast(`Navigating to ${name} — tap Stop when you're done`);
  if (meLatLng) navTick(meLatLng[0], meLatLng[1]);
  else updateNavHud();
}
function stopNavTo() {
  if (!navTarget) return;
  if (navTarget.line) map.removeLayer(navTarget.line);
  navTarget = null;
  removeNavHud();
  stopHeadingWatch();
  renderStands();
}

/* ---- scent drift cone — a 20-second on-demand check (tap a stand or your dot) ---- */
let scentLayer = null;
let scentTimer = null;
const SCENT_MS = 20000;

function clearScent() {
  clearTimeout(scentTimer);
  scentTimer = null;
  if (scentLayer) { map.removeLayer(scentLayer); scentLayer = null; }
}
function showScent(lat, lng, opts) {
  clearScent();
  if (!map || !state.settings.scentCone) return;
  const d = scentDrift(lat, lng);
  if (!d) return;
  const grp = L.featureGroup();
  L.polygon(conePts(lat, lng, d.toDeg, d.mph, d.thermalShare), {
    className: "scent-cone", stroke: false, fill: true,
    fillColor: "#7cd2ff", fillOpacity: 0.13, interactive: false,
  }).addTo(grp);
  const len = clamp(70 + d.mph * 15, 80, 340);
  const spread = d.thermalShare > 0.3 ? 15 : 8;
  for (let k = -1; k <= 1; k++)
    L.polyline(
      [[lat, lng], destPoint(lat, lng, d.toDeg + k * spread, len * (0.76 + 0.12 * (k + 1)))],
      { className: "scent-flow", color: "#a9e2ff", weight: 2, opacity: 0.55, dashArray: "3 9", lineCap: "round", interactive: false }
    ).addTo(grp);
  // safe walk-in wedge (Feature C) — green, on the side you should approach from
  if (opts && opts.approachDeg != null) {
    const wl = 120;
    const wpts = [[lat, lng]];
    for (let a = -26; a <= 26.001; a += 13) wpts.push(destPoint(lat, lng, opts.approachDeg + a, wl));
    L.polygon(wpts, { className: "approach-wedge", stroke: false, fill: true, fillColor: "#5fd08a", fillOpacity: 0.16, interactive: false }).addTo(grp);
    L.marker(destPoint(lat, lng, opts.approachDeg, wl * 0.62), {
      interactive: false,
      icon: L.divIcon({ className: "", html: `<div class="approach-tag">walk in</div>`, iconSize: [1, 1] }),
    }).addTo(grp);
  }
  grp.addTo(map);
  scentLayer = grp;
  // fade out over the final ~800ms, then remove
  scentTimer = setTimeout(() => {
    try {
      grp.eachLayer((ly) => { if (ly._path) { ly._path.style.transition = "opacity .8s"; ly._path.style.opacity = "0"; } });
    } catch (e) {}
    scentTimer = setTimeout(clearScent, 850);
  }, SCENT_MS - 850);
}

function scentDrift(lat, lng) {
  const c = conditionsAtHunt();
  if (!c || c.windMph == null) return null;
  let fromDeg = c.windFrom, mph = c.windMph, thermalShare = 0;
  if (window.DPTerrain && DPTerrain.current && DPTerrain.effectiveWind) {
    const eff = DPTerrain.effectiveWind(lat, lng, c.windFrom, c.windMph, huntPhase());
    if (eff) { fromDeg = eff.fromDeg; thermalShare = eff.thermalShare || 0; }
  }
  return { toDeg: (fromDeg + 180) % 360, fromDeg, mph, thermalShare };
}
function conePts(lat, lng, toDeg, mph, thermalShare) {
  const len = clamp(70 + mph * 15, 80, 340);
  const half = thermalShare > 0.3 ? 34 : mph < 5 ? 28 : 17;
  const pts = [[lat, lng]];
  for (let a = -half; a <= half + 0.001; a += half / 5)
    pts.push(destPoint(lat, lng, toDeg + a, len));
  return pts;
}

function bearingDeg(lat1, lng1, lat2, lng2) {
  const r = Math.PI / 180;
  const y = Math.sin((lng2 - lng1) * r) * Math.cos(lat2 * r);
  const x =
    Math.cos(lat1 * r) * Math.sin(lat2 * r) -
    Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lng2 - lng1) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

/* Feature C: which way to walk in to a stand today without winding deer.
   Come in from downwind (wind in your face), off the deer's approach line and
   away from any marked bedding. */
function standApproach(st) {
  const d = scentDrift(st.lat, st.lng);
  if (!d) return null;
  const dd = deerDirsOf(st).map(dirToDeg);
  const beds = (pSigns() || [])
    .filter((s) => s.type === "bedding")
    .map((s) => ({ brg: bearingDeg(st.lat, st.lng, s.lat, s.lng), dist: map.distance([st.lat, st.lng], [s.lat, s.lng]) }))
    .filter((b) => b.dist < 400);
  let best = null;
  for (let i = 0; i < 8; i++) {
    const cand = i * 45;
    let sc = 1 - angDiff(cand, d.toDeg) / 180; // come in from downwind (toDeg side)
    sc -= (1 - angDiff(cand, d.fromDeg) / 180) * 0.7; // not from upwind
    dd.forEach((x) => { sc -= Math.max(0, 1 - angDiff(cand, x) / 60) * 1.5; }); // off the deer's line
    beds.forEach((b) => { sc -= Math.max(0, 1 - angDiff(cand, b.brg) / 60) * 1.7; }); // away from beds
    if (!best || sc > best.sc) best = { deg: cand, sc };
  }
  const compass = degToCompass8(best.deg);
  const why = beds.length
    ? "downwind, and off the bedding"
    : dd.length
    ? `keeps your wind off the ${dd.map(degToCompass8).join("/")} deer`
    : "so the wind's in your face and your scent trails away behind you";
  return { deg: best.deg, compass, text: `Come in from the ${compass} — ${why}` };
}

/* address / place search (OpenStreetMap Nominatim — free, no key) */
/* address / place search — pinned in the panel (above every section) so it never
   sits over the map and block popups like "add a harvest" on a phone */
function initAddressSearch() {
  const form = $("#addrForm"), input = $("#addrInput"), res = $("#addrRes");
  if (!form) return;
  form.onsubmit = (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    res.innerHTML = `<div class="panel-search-hint">searching…</div>`;
    fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=" + encodeURIComponent(q),
      { headers: { Accept: "application/json" } }
    )
      .then((r) => r.json())
      .then((rows) => {
        if (!rows || !rows.length) {
          res.innerHTML = `<div class="panel-search-hint">nothing found</div>`;
          return;
        }
        res.innerHTML = rows
          .map((x, i) => `<button type="button" class="panel-search-row" data-i="${i}">${esc(x.display_name)}</button>`)
          .join("");
        res.querySelectorAll(".panel-search-row").forEach((b) => {
          b.onclick = () => {
            const x = rows[+b.dataset.i];
            const bb = x.boundingbox;
            if (bb) map.fitBounds([[+bb[0], +bb[2]], [+bb[1], +bb[3]]], { maxZoom: 16, padding: [30, 30] });
            else map.setView([+x.lat, +x.lon], 15);
            res.innerHTML = "";
            input.value = "";
            input.blur();
            if (window.matchMedia("(max-width:640px)").matches) hidePanel();
          };
        });
      })
      .catch(() => {
        res.innerHTML = `<div class="panel-search-hint">search unavailable — check your connection</div>`;
      });
  };
}

/* ---- distance ruler — tap points on the map, running yardage ---- */
let measure = null; // { pts:[latlng], line, dots:[], labels:[] }

function fmtDist(m) {
  const yd = m * 1.09361;
  if (yd < 1000) return Math.round(yd) + " yd";
  return (m / 1609.34).toFixed(2) + " mi";
}
function measureTotal() {
  if (!measure || measure.pts.length < 2) return 0;
  let t = 0;
  for (let i = 1; i < measure.pts.length; i++) t += map.distance(measure.pts[i - 1], measure.pts[i]);
  return t;
}
function renderMeasure() {
  if (!measure) return;
  measure.dots.forEach((d) => map.removeLayer(d));
  measure.labels.forEach((l) => map.removeLayer(l));
  measure.dots = [];
  measure.labels = [];
  if (measure.line) { map.removeLayer(measure.line); measure.line = null; }

  if (!measure.pts.length) return;

  measure.line = L.polyline(measure.pts, { color: "#ffd24a", weight: 3, dashArray: "6 5", interactive: false }).addTo(map);
  measure.pts.forEach((ll, i) => {
    measure.dots.push(
      L.circleMarker(ll, { radius: 4, color: "#ffd24a", weight: 2, fillColor: "#141a1e", fillOpacity: 1, interactive: false }).addTo(map)
    );
    if (i > 0) {
      const seg = map.distance(measure.pts[i - 1], ll);
      const mid = L.latLng((measure.pts[i - 1].lat + ll.lat) / 2, (measure.pts[i - 1].lng + ll.lng) / 2);
      measure.labels.push(
        L.marker(mid, {
          interactive: false,
          icon: L.divIcon({ className: "", html: `<div class="measure-seg">${fmtDist(seg)}</div>`, iconSize: [1, 1] }),
        }).addTo(map)
      );
    }
  });
  // running total sits on the last point
  if (measure.pts.length >= 2) {
    measure.labels.push(
      L.marker(measure.pts[measure.pts.length - 1], {
        interactive: false, zIndexOffset: 1000,
        icon: L.divIcon({ className: "", html: `<div class="measure-total">${fmtDist(measureTotal())} total</div>`, iconSize: [1, 1] }),
      }).addTo(map)
    );
  }
}
/* if a tap lands within ~20px of a placed marker, snap the point exactly onto it */
function snapToMarker(latlng) {
  const c = map.latLngToContainerPoint(latlng);
  let best = null, bd = 22;
  const all = []
    .concat(Object.values(standMarkers), Object.values(signMarkers), Object.values(harvestMarkers), scoutMarkers || [], meMarker ? [meMarker] : []);
  all.forEach((m) => {
    if (!m || !m.getLatLng) return;
    const d = c.distanceTo(map.latLngToContainerPoint(m.getLatLng()));
    if (d < bd) { bd = d; best = m.getLatLng(); }
  });
  return best || latlng;
}
function addMeasurePoint(ll) {
  if (!measure) return;
  measure.pts.push(snapToMarker(ll));
  renderMeasure();
}
function startMeasure() {
  if (measure) return;
  if (placing) cancelPlace();
  if (movingPin) cancelMovePin();
  measure = { pts: [], line: null, dots: [], labels: [] };
  document.body.style.cursor = "crosshair";
  map.getContainer().classList.add("measuring"); // makes every pin inert (CSS) so none can be dragged
  const btn = $(".dp-ruler");
  if (btn) btn.classList.add("on");
  renderMeasure();
  toast("Tap points to measure — tap the ruler again to finish");
}
function stopMeasure() {
  if (!measure) return;
  measure.dots.forEach((d) => map.removeLayer(d));
  measure.labels.forEach((l) => map.removeLayer(l));
  if (measure.line) map.removeLayer(measure.line);
  measure = null;
  document.body.style.cursor = "";
  map.getContainer().classList.remove("measuring");
  const btn = $(".dp-ruler");
  if (btn) btn.classList.remove("on");
}

const RulerControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {

    b.type = "button";

    b.innerHTML =
      `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block"><path fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" d="M3 8h18v8H3z"/><path stroke="#333" stroke-width="2" d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>`;
    L.DomEvent.on(b, "click", L.DomEvent.stop).on(b, "click", () => (measure ? stopMeasure() : startMeasure()));
    return b;

/* ---- long-press to move a pin ----
   Markers start non-draggable so a normal touch that lands on a pin still pans/pinches
   the map underneath it. Hold ~half a second without moving to "arm" the pin, then drag
   it (still holding) and lift to drop. A quick tap still opens it as before. */
const LONGPRESS_MS = 550;
const LONGPRESS_SLOP = 10; // px of finger wobble tolerated before the hold is cancelled

function lpEvtPoint(e) {
  const t = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
  return { x: t.clientX, y: t.clientY };
}
function lpEvtLatLng(e) {
  const t = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
  return map.mouseEventToLatLng(t);
}
let lpCancelPending = null; // cancel() of a not-yet-armed long-press, so a second finger (pinch) can kill it
document.addEventListener(
  "touchstart",
  (e) => { if (e.touches && e.touches.length > 1 && lpCancelPending) { lpCancelPending(); lpCancelPending = null; } },
  { passive: true, capture: true }
);

function enableLongPressMove(marker, handlers) {
  let timer = null, armed = false, startPt = null, el = null, tookMapDrag = false;

  function cancel() {
    clearTimeout(timer);
    timer = null;
    if (lpCancelPending === cancel) lpCancelPending = null;
  }
  function docMove(e) { onMove(e); }
  function docUp(e) { onUp(e); }
  function arm() {
    if (measure || placing) { cancel(); return; } // never move a pin while the ruler / a place flow is up
    armed = true;
    timer = null;
    if (lpCancelPending === cancel) lpCancelPending = null;
    if (el) el.classList.add("marker-armed");
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    toast("Drag to move — lift to drop");
    // the original touch/mousedown also reached the map underneath — fully lock map
    // panning while we own the gesture, or Leaflet's own drag machinery fights ours
    if (map.dragging && map.dragging.enabled()) { map.dragging.disable(); tookMapDrag = true; }
    document.addEventListener("mousemove", docMove);
    document.addEventListener("mouseup", docUp);
    handlers.onStart && handlers.onStart(marker.getLatLng());
  }
  function disarm() {
    armed = false;
    if (el) el.classList.remove("marker-armed");
    if (tookMapDrag) { map.dragging.enable(); tookMapDrag = false; }
    document.removeEventListener("mousemove", docMove);
    document.removeEventListener("mouseup", docUp);
  }
  function onDown(e) {
    if (measure || placing) return; // ruler / placing mode owns map taps — don't grab the pin
    if (e.touches && e.touches.length > 1) { cancel(); return; }
    if (armed) return;
    startPt = lpEvtPoint(e);
    cancel();
    timer = setTimeout(arm, LONGPRESS_MS);
    lpCancelPending = cancel;
  }
  function onMove(e) {
    if (!armed) {
      if (timer) {
        const p = lpEvtPoint(e);
        if (Math.hypot(p.x - startPt.x, p.y - startPt.y) > LONGPRESS_SLOP) cancel();
      }
      return;
    }
    if (e.cancelable) e.preventDefault();
    const ll = lpEvtLatLng(e);
    marker.setLatLng(ll);
    handlers.onMove && handlers.onMove(ll);
  }
  function onUp() {
    cancel();
    if (armed) {
      const ll = marker.getLatLng();
      disarm();
      handlers.onEnd && handlers.onEnd(ll);
    }
  }

  marker.on("add", () => {
    el = marker.getElement();
    if (!el) return;
    el.addEventListener("touchstart", onDown, { passive: true });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onUp, { passive: true });
    el.addEventListener("touchcancel", onUp, { passive: true });
    el.addEventListener("mousedown", onDown);
  });
  marker.on("remove", () => { cancel(); if (armed) disarm(); });
}

/* ---- harvest log ---- */
function harvestIcon(h) {
  const buck = h.sex === "buck";
  return L.divIcon({
    className: "",
    html: `<div class="harvest-pin">${deerHeadSVG(buck, 26)}</div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 15],
  });
}
function harvestLabel(h) {
  const sex = (HARVEST_SEX.find((s) => s[0] === h.sex) || ["", "Deer"])[1];
  const pts = h.sex === "buck" && h.points ? ` · ${h.points} pt` : "";
  const from = h.fromDir ? ` · from ${h.fromDir}` : "";
  return sex + pts + from;
}
const yardsTo = (lat, lng, s) => Math.round(map.distance([lat, lng], [s.lat, s.lng]) * 1.09361);
function nearestStand(lat, lng) {
  let best = null, bd = Infinity;
  pStands().forEach((s) => {
    const d = yardsTo(lat, lng, s);
    if (d < bd) { bd = d; best = s; }
  });
  return best ? { stand: best, yd: bd } : null;
}
function nearestStandId(lat, lng, maxYd) {
  const n = nearestStand(lat, lng);
  return n && n.yd <= (maxYd || 70) ? n.stand.id : null;
}

/* short tooltip on the marker; live distance readout for the popup */
function harvestTooltipText(h) {
  if (!pStands().length) return "";
  const linked = h.stand ? state.stands.find((s) => s.id === h.stand) : null;
  if (linked) return `${yardsTo(h.lat, h.lng, linked)} yd → ${esc(linked.name)}`;
  const n = nearestStand(h.lat, h.lng);
  return n ? `${n.yd} yd → ${esc(n.stand.name)} (nearest)` : "";
}
function harvestDistLine(h) {
  if (!pStands().length) return "No stands mapped yet.";
  const linked = h.stand ? state.stands.find((s) => s.id === h.stand) : null;
  const n = nearestStand(h.lat, h.lng);
  if (linked) {
    let t = `${yardsTo(h.lat, h.lng, linked)} yd from ${linked.name}`;
    if (n && n.stand.id !== linked.id) t += ` · nearest is ${n.stand.name} at ${n.yd} yd`;
    return t;
  }
  return n ? `${n.yd} yd from ${n.stand.name} (nearest — pick it above to link)` : "";
}

function closeHarvestTips() {
  Object.values(harvestMarkers).forEach((m) => {
    try { m.closeTooltip(); } catch (e) {}
  });
}

function renderHarvestMarkers() {
  Object.values(harvestMarkers).forEach((m) => map.removeLayer(m));
  harvestMarkers = {};
  pHarvests().forEach((h) => {
    const m = L.marker([h.lat, h.lng], { icon: harvestIcon(h), draggable: false });
    if (pStands().length)
      m.bindTooltip(harvestTooltipText(h) || "no stands mapped", {
        permanent: true, direction: "top", offset: [0, -12], className: "harvest-tt",
      });

    const showTip = () => {
      if (!m.getTooltip()) return;
      m.setTooltipContent(harvestTooltipText(h) || "no stands mapped");
      m.openTooltip();
    };

    m.on("click", () => {
      if (measure) { addMeasurePoint(m.getLatLng()); return; }
      closeHarvestTips();
      showTip();
      harvestPopup(h, m);
    });
    enableLongPressMove(m, {
      onStart: () => { closeHarvestTips(); showTip(); },
      onMove: (ll) => {
        h.lat = ll.lat;
        h.lng = ll.lng;
        if (m.getTooltip()) m.setTooltipContent(harvestTooltipText(h) || "no stands mapped");
        const dl = document.getElementById("hvDistLine");
        if (dl) dl.textContent = harvestDistLine(h);
      },
      onEnd: () => {
        saveState();
        renderHarvestPanel();
        renderStands();
        clearTimeout(m._ttHide);
        m._ttHide = setTimeout(() => { try { m.closeTooltip(); } catch (e) {} }, 1400);
      },
    });
    m.addTo(map);
    if (m.getTooltip()) m.closeTooltip(); // hidden until clicked or dragged
    harvestMarkers[h.id] = m;
  });
}

function renderHarvestPanel() {
  const box = $("#harvestBox");
  if (!box) return;
  const hs = pHarvests().slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const list = hs.length
    ? hs
        .map((h) => {
          const dt = new Date((h.date || todayISO()) + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit" });
          const st = h.stand ? (state.stands.find((s) => s.id === h.stand) || {}).name : "";
          return `<div class="sign-row" data-harvest="${h.id}">
            <span class="harvest-chip">${deerHeadSVG(h.sex === "buck", 20)}</span>
            <span class="sign-nm">${esc(harvestLabel(h))}
              <div class="ty">${dt}${st ? " · " + esc(st) : ""}${h.note ? " · " + esc(h.note.slice(0, 30)) : ""}</div></span>
