        })
        .join("")
    : `<div class="hint">No harvests logged yet — use the + button on the map, or the button below.</div>`;

  const activeH = placing && placing.kind === "harvest";
  box.innerHTML =
    list +
    (activeH
      ? placeControlsHTML("harvest")
      : `<div class="btn-row" style="margin-top:10px"><button class="btn btn-sm" data-place="harvest">+ Log a harvest</button></div>`);

  $$(".sign-row", box).forEach((n) => {
    n.onclick = () => {
      const h = state.harvests.find((x) => x.id === n.dataset.harvest);
      if (!h) return;
      map.setView([h.lat, h.lng], Math.max(map.getZoom(), 16));
      harvestPopup(h, harvestMarkers[h.id]);
      if (window.matchMedia("(max-width:640px)").matches) hidePanel();
    };
  });
  wirePlaceControls(box);
}

/* ---- recovery: shot spot, wait guidance, blood marks + GPS breadcrumb ---- */
let trackingId = null;
let recoveryLayer = null;

const HIT_GUIDE = {
  heartlung: { name: "Heart / lungs",  waitMin: 45,  text: "30–60 min. If you watched it crash, go now. Blood is bright pink and frothy." },
  liver:     { name: "Liver",          waitMin: 300, text: "Back out. Wait 4–6 hours. Dark red blood; the hit sits just behind the ribs." },
  gut:       { name: "Gut / paunch",   waitMin: 660, text: "Back out quietly now. Wait 8–12 hours, longer if it's warm. Green/brown flecks, strong smell." },
  shoulder:  { name: "Shoulder / high",waitMin: 300, text: "Back out. Wait 4–6 hours, then trail slowly — high hits can be non-fatal, give it every chance." },
  unknown:   { name: "Not sure",       waitMin: 240, text: "Back out and wait at least 4 hours. Study the arrow and any video of the hit before you start." },
};

function activeTrack() {
  const t = (state.tracks || []).filter((x) => !x.recovered);
  return t.length ? t[t.length - 1] : null;
}
function trackById(id) { return (state.tracks || []).find((t) => t.id === id) || null; }
function trailYards(crumbs) {
  let m = 0;
  for (let i = 1; i < crumbs.length; i++) m += map.distance(crumbs[i - 1], crumbs[i]);
  return Math.round(m * 1.09361);
}

function setShotSpot(lat, lng) {
  state.tracks.push({
    id: uid(), date: todayISO(), startTs: Date.now(),
    shotLat: lat, shotLng: lng, hit: null,
    bloods: [], crumbs: [], recovered: false, harvestId: null, note: "",
  });
  saveState();
  renderTrackLayers();
  renderRecoveryPanel();
  openSection("recovery");
  map.setView([lat, lng], Math.max(map.getZoom(), 16));
  toast("Shot marked — pick the hit, then back out or start tracking");
}
function addBloodMark(lat, lng, last) {
  const t = activeTrack();
  if (!t) { toast("Mark the shot first"); return; }
  t.bloods.push({ lat, lng, ts: Date.now(), last: !!last });
  saveState();
  renderTrackLayers();
  renderRecoveryPanel();
  toast(last ? "Last blood marked" : `Blood mark ${t.bloods.length}`);
}
function markBloodHere(last) {
  const t = activeTrack();
  if (!t) return;
  if (meLatLng) addBloodMark(meLatLng[0], meLatLng[1], last);
  else { beginPlace("blood"); if (placing) placing.last = !!last; }
}
function beginTracking() {
  const t = activeTrack();
  if (!t) return;
  trackingId = t.id;
  setGpsHiAcc(true);
  if (!locateOn) toggleLocate();
  renderRecoveryPanel();
  toast("Tracking — walk the line slowly, tap Blood at each spot");
  if (window.matchMedia("(max-width:640px)").matches) hidePanel();
}
function stopTracking() {
  trackingId = null;
  setGpsHiAcc(false);
  if (locateOn) armGpsTimer();
  saveState();
  renderRecoveryPanel();
  toast("Tracking paused — your trail is saved");
}
function trackTick(lat, lng) {
  if (!trackingId) return;
  const t = trackById(trackingId);
  if (!t) return;
  const last = t.crumbs[t.crumbs.length - 1];
  if (last && map.distance([last[0], last[1]], [lat, lng]) < 4) return; // GPS jitter
  t.crumbs.push([lat, lng, Date.now()]);
  if (t.crumbs.length % 8 === 0) saveState();
  renderTrackLayers();
  const el = $("#recTrail");
  if (el) el.textContent = `${t.bloods.length} blood · ${trailYards(t.crumbs)} yd walked`;
}
function recoverTrack(id) {
  const t = trackById(id);
  if (!t) return;
  t.recovered = true;
  if (trackingId === t.id) { trackingId = null; setGpsHiAcc(false); }
  saveState();
  const lb = t.bloods.filter((b) => b.last)[0];
  const end = lb || t.bloods[t.bloods.length - 1] ||
    (t.crumbs.length ? { lat: t.crumbs[t.crumbs.length - 1][0], lng: t.crumbs[t.crumbs.length - 1][1] }
                     : { lat: t.shotLat, lng: t.shotLng });
  renderTrackLayers();
  renderRecoveryPanel();
  createHarvest(end.lat, end.lng);
  toast("Nice — log the deer");
}
function deleteTrack(id) {
  state.tracks = state.tracks.filter((t) => t.id !== id);
  if (trackingId === id) { trackingId = null; setGpsHiAcc(false); }
  saveState();
  renderTrackLayers();
  renderRecoveryPanel();
}

function shotIcon() {
  return L.divIcon({ className: "", html: `<div class="shot-pin">✕</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
}
function bloodIcon(last) {
  return L.divIcon({
    className: "",
    html: `<div class="blood-pin${last ? " last" : ""}"></div>`,
    iconSize: last ? [16, 16] : [11, 11],
    iconAnchor: last ? [8, 8] : [6, 6],
  });
}
function renderTrackLayers() {
  if (recoveryLayer) { map.removeLayer(recoveryLayer); recoveryLayer = null; }
  const t = activeTrack() || (state.tracks || []).slice(-1)[0];
  if (!t) return;
  const grp = L.featureGroup();
  if (t.crumbs.length > 1)
    L.polyline(t.crumbs.map((c) => [c[0], c[1]]), { color: "#4a9eff", weight: 2, dashArray: "4 6", interactive: false }).addTo(grp);
  if (t.shotLat != null)
    L.marker([t.shotLat, t.shotLng], { icon: shotIcon(), interactive: false }).addTo(grp);
  t.bloods.forEach((b) =>
    L.marker([b.lat, b.lng], { icon: bloodIcon(b.last) })
      .addTo(grp)
      .bindTooltip(b.last ? "last blood" : "blood", { direction: "top", offset: [0, -6] })
  );
  grp.addTo(map);
  recoveryLayer = grp;
}

function placeRecoveryControls() {
  return `<div class="place-box">
    <div class="hint">Placing — pick one:</div>
    <div class="btn-row">
      <button class="btn btn-sm" data-recpa="me">Use my location</button>
      <button class="btn btn-sm btn-ghost" data-recpa="map">Tap map</button>
      <button class="btn btn-sm btn-ghost" data-recpa="cancel">✕</button>
    </div>
  </div>`;
}

function renderRecoveryPanel() {
  const box = $("#recoveryBox");
  if (!box) return;
  const t = activeTrack();
  const placingRec = placing && (placing.kind === "shot" || placing.kind === "blood");
  const past = (state.tracks || []).filter((x) => x.recovered);
  const pastHTML = past.length
    ? `<label class="fld">Recovered</label>` +
      past.slice().reverse().map((x) => {
        const d = new Date((x.date || todayISO()) + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
        return `<div class="sign-row" style="cursor:default">
          <span class="sign-nm">${d} · ${x.bloods.length} blood · ${trailYards(x.crumbs)} yd
            <div class="ty">${HIT_GUIDE[x.hit] ? esc(HIT_GUIDE[x.hit].name) : "hit not set"}</div></span>
          <button class="area-x" data-trk-del="${x.id}" title="Delete">✕</button></div>`;
      }).join("")
    : "";

  if (!t) {
    box.innerHTML =
      `<div class="hint">After a shot: mark where the deer was standing, pick the hit, and the app tells you how long to wait — then track with a GPS breadcrumb and blood marks.</div>` +
      (placingRec ? placeRecoveryControls()
        : `<div class="btn-row"><button class="btn btn-sm" id="recStartShot">Mark a shot</button></div>`) +
      pastHTML;
    wireRecovery(box);
    renderTrackLayers();
    return;
  }

  const elapsed = Math.round((Date.now() - t.startTs) / 60000);
  const elapsedStr = elapsed < 60 ? `${elapsed} min` : `${Math.floor(elapsed / 60)} hr ${elapsed % 60} min`;
  const g = t.hit ? HIT_GUIDE[t.hit] : null;
  const waitStr = g ? (g.waitMin < 60 ? `${g.waitMin} min` : `~${Math.round(g.waitMin / 60)} hr`) : "";
  const ready = g && elapsed >= g.waitMin;

  box.innerHTML = `
    <div class="rec-shot">Shot ${fmtClock(new Date(t.startTs))} · <b>${elapsedStr} ago</b></div>
    <label class="fld">Where did it hit?</label>
    <div class="chips-row" id="recHit">
      ${Object.entries(HIT_GUIDE).map(([k, v]) => `<button class="chip-btn ${t.hit === k ? "on" : ""}" data-hit="${k}">${esc(v.name)}</button>`).join("")}
    </div>
    ${g ? `<div class="rec-guide ${ready ? "go" : "wait"}">
        <b>${esc(g.name)}.</b> ${esc(g.text)}
        <div class="rec-wait">${ready
          ? `You've waited ${elapsedStr} — okay to take up the trail slowly.`
          : `Waited ${elapsedStr} of ${waitStr}. Sit tight; back out quietly if you're still near the deer.`}</div>
      </div>` : `<div class="hint">Pick the hit for a wait time.</div>`}
    <label class="fld">Tracking</label>
    <div id="recTrail" class="hint">${t.bloods.length} blood · ${trailYards(t.crumbs)} yd walked</div>
    <div class="btn-row">
      ${trackingId === t.id
        ? `<button class="btn btn-sm" data-rec="blood">Blood</button>
           <button class="btn btn-sm btn-ghost" data-rec="lastblood">Last blood</button>
           <button class="btn btn-sm btn-ghost" data-rec="stoptrack">Stop</button>`
        : `<button class="btn btn-sm" data-rec="track">Start tracking</button>
           <button class="btn btn-sm btn-ghost" data-rec="blood">Mark blood</button>`}
    </div>
    ${placingRec ? placeRecoveryControls() : ""}
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-sm" data-rec="recovered">Recovered — log it</button>
      <button class="btn btn-sm btn-danger" data-rec="del">Delete</button>
    </div>
    ${pastHTML}`;
  wireRecovery(box);
  renderTrackLayers();
}

function wireRecovery(box) {
  const ss = $("#recStartShot", box);
  if (ss) ss.onclick = () => beginPlace("shot");
  $$("[data-hit]", box).forEach((b) => {
    b.onclick = () => {
      const t = activeTrack();
      if (!t) return;
      t.hit = b.dataset.hit;
      saveState();
      renderRecoveryPanel();
    };
  });
  $$("[data-rec]", box).forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.rec;
      const t = activeTrack();
      if (a === "track") beginTracking();
      else if (a === "stoptrack") stopTracking();
      else if (a === "blood") markBloodHere(false);
      else if (a === "lastblood") markBloodHere(true);
      else if (a === "recovered") { if (t && confirm("Mark this deer recovered and log the harvest?")) recoverTrack(t.id); }
      else if (a === "del") { if (t && confirm("Delete this recovery track?")) deleteTrack(t.id); }
    };
  });
  $$("[data-trk-del]", box).forEach((b) => {
    b.onclick = () => { if (confirm("Delete this track?")) deleteTrack(b.dataset.trkDel); };
  });
  $$("[data-recpa]", box).forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.recpa;
      if (a === "cancel") cancelPlace();
      else if (a === "map") toast("Tap the map to place it");
      else if (a === "me") {
        if (!meLatLng) { toast("Turn on location (◎) first"); if (!locateOn) toggleLocate(); return; }
        const k = placing && placing.kind, last = placing && placing.last;
        placing = null;
        document.body.style.cursor = "";
        if (k === "shot") setShotSpot(meLatLng[0], meLatLng[1]);
        else addBloodMark(meLatLng[0], meLatLng[1], last);
      }
    };
  });
}

/* ---- shapes (property line / trail) ---- */
const SHAPE_STYLE = {
  boundary: { color: "#e0863a", weight: 3, fill: false, dashArray: null },
  trail: { color: "#c9a878", weight: 2, dashArray: "5 6", fill: false },
};

function startDraw(kind) {
  const style = SHAPE_STYLE[kind];
  const handler =
    kind === "boundary"
      ? new L.Draw.Polygon(map, { shapeOptions: style, showArea: false })
      : new L.Draw.Polyline(map, { shapeOptions: style });
  handler._dp_kind = kind;
  map._dp_activeDraw = handler;
  handler.enable();
  toast(kind === "boundary" ? "Click corners; click first point to close" : "Click along the trail; double-click to finish");
}

function onDrawCreated(e) {
  const kind = (map._dp_activeDraw && map._dp_activeDraw._dp_kind) || "trail";
  const latlngs = flattenLatLngs(e.layer.getLatLngs());
  const label = prompt(kind === "boundary" ? "Name this property line:" : "Label for this trail:", kind === "boundary" ? "Property line" : "Trail");
  const shape = { id: uid(), kind, latlngs, label: label || "" };
  state.shapes.push(shape);
  saveState();
  shapesChanged();
}

/* recompute grouping + redraw everything after any shape add/remove/edit */
function shapesChanged() {
  recomputeActiveBoundary();
  drawnItems.clearLayers();
  pShapes().forEach(addShapeToMap);
  renderAreaJump();
  renderStandMarkers();
  renderSignMarkers();
  renderHarvestMarkers();
  renderMapTools();
  renderStands();
  renderSignsPanel();
  renderHarvestPanel();
  renderScoutPanel();
}

function flattenLatLngs(a) {
  const out = [];
  (function walk(x) {
    if (Array.isArray(x)) x.forEach(walk);
    else out.push([x.lat, x.lng]);
  })(a);
  return out;
}

function addShapeToMap(shape) {
  if (shape.kind === "trail" && state.settings.showTrails === false) return;
  const style = SHAPE_STYLE[shape.kind];
  const layer =
    shape.kind === "boundary"
      ? L.polygon(shape.latlngs, style)
      : L.polyline(shape.latlngs, style);
  layer._dp_id = shape.id;
  // trail labels stay off the map to keep it clean — tap the line to see its name and delete it
  if (shape.label && shape.kind !== "trail") layer.bindTooltip(esc(shape.label), { permanent: true, direction: "center", className: "shape-label" });
  layer.on("click", (ev) => {
    L.DomEvent.stop(ev);
    shapePopup(shape, layer, ev.latlng);
  });
  layer.addTo(drawnItems);
}

function shapePopup(shape, layer, latlng) {
  const div = document.createElement("div");
  div.innerHTML =
    `<div style="font-size:13px;margin-bottom:6px">${esc(shape.label || "(no label)")} · ${shape.latlngs.length} points</div>` +
    `<button class="btn btn-sm" data-a="edit">Edit corners</button> ` +
    `<button class="btn btn-sm btn-ghost" data-a="ren">Rename</button> ` +
    `<button class="btn btn-sm btn-danger" data-a="del">Delete</button>`;
  div.querySelector('[data-a="edit"]').onclick = () => {
    map.closePopup();
    startCornerEditor(shape.kind, shape);
  };
  div.querySelector('[data-a="ren"]').onclick = () => {
    const nv = prompt(shape.kind === "boundary" ? "Name this property line:" : "Label:", shape.label || "");
    if (nv == null) return;
    shape.label = nv;
    saveState();
    map.closePopup();
    shapesChanged();
  };
  div.querySelector('[data-a="del"]').onclick = () => {
    state.shapes = state.shapes.filter((s) => s.id !== shape.id);
    saveState();
    map.closePopup();
    shapesChanged();
  };
  L.popup().setLatLng(latlng).setContent(div).openOn(map);
}

/* ---- corner editor: build / edit a boundary or trail by coordinates ---- */
let cornerEd = null; // { kind, shapeId?, verts:[[lat,lng]...], label, tapMode }
let cornerLayer = null;
let cornerHandles = [];

function startCornerEditor(kind, shape) {
  cornerEd = {
    kind,
    shapeId: shape ? shape.id : null,
    verts: shape ? shape.latlngs.map((v) => [v[0], v[1]]) : [],
    label: shape ? shape.label || "" : "",
    tapMode: !shape,
  };
  openSection("map");
  renderMapTools();
  refreshCornerEdit(true);
  if (!shape) toast("Tap the map to drop corners, or type coordinates");
}
function cancelCornerEditor() {
  cornerEd = null;
  clearCornerEdit();
  renderMapTools();
}
function clearCornerEdit() {
  if (cornerLayer) { map.removeLayer(cornerLayer); cornerLayer = null; }
  cornerHandles.forEach((h) => map.removeLayer(h));
  cornerHandles = [];
}
function cornerPts() {
  return cornerEd.verts.filter((v) => v && isFinite(v[0]) && isFinite(v[1]) && Math.abs(v[0]) <= 90 && Math.abs(v[1]) <= 180);
}
function refreshLineOnly() {
  if (cornerLayer) { map.removeLayer(cornerLayer); cornerLayer = null; }
  const pts = cornerPts();
  const min = cornerEd.kind === "boundary" ? 3 : 2;
  if (pts.length >= min) {
    const style = { color: "#ffd24a", weight: 2, dashArray: "5 5", fill: false };
    cornerLayer = (cornerEd.kind === "boundary" ? L.polygon : L.polyline)(pts, style).addTo(map);
  }
}
function refreshCornerEdit(fit) {
  clearCornerEdit();
  refreshLineOnly();
  cornerEd.verts.forEach((v, i) => {
    if (!v || !isFinite(v[0]) || !isFinite(v[1])) return;
    const h = L.marker(v, {
      draggable: true,
      icon: L.divIcon({ className: "", html: `<div class="vtx">${i + 1}</div>`, iconSize: [20, 20], iconAnchor: [10, 10] }),
    }).addTo(map);
    h.on("drag", (e) => {
      const p = e.target.getLatLng();
      cornerEd.verts[i] = [p.lat, p.lng];
      const la = $(`#mv-lat-${i}`), ln = $(`#mv-lng-${i}`);
      if (la) la.value = p.lat.toFixed(6);
      if (ln) ln.value = p.lng.toFixed(6);
      refreshLineOnly();
    });
    h.on("dragend", () => refreshCornerEdit());
    cornerHandles.push(h);
  });
  const pts = cornerPts();
  if (fit && pts.length >= 2) {
    setTimeout(() => {
      try {
        map.invalidateSize();
        map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 16 });
      } catch (e) {}
    }, 60);
  }
}
function commitCornerEditor() {
  const pts = cornerPts();
  const min = cornerEd.kind === "boundary" ? 3 : 2;
  if (pts.length < min) {
    toast(`Need at least ${min} valid points`);
    return;
  }
  if (cornerEd.shapeId) {
    const sh = state.shapes.find((s) => s.id === cornerEd.shapeId);
    sh.latlngs = pts;
    sh.label = cornerEd.label;
  } else {
    state.shapes.push({ id: uid(), kind: cornerEd.kind, latlngs: pts, label: cornerEd.label });
  }
  saveState();
  cornerEd = null;
  clearCornerEdit();
  shapesChanged();
  toast("Saved");
}

function renderMapTools() {
  const box = $("#mapTools");
  if (!box) return;

  if (!cornerEd) {
    const shapeRows = pShapes()
      .map(
        (s) => `<div class="shape-row" data-shp="${s.id}">
          <span class="shape-dot ${s.kind}"></span>
          <span class="shape-nm">${esc(s.label || (s.kind === "boundary" ? "Property line" : "Trail"))}
            <div class="ty">${s.kind === "boundary" ? "property line" : "trail"} · ${s.latlngs.length} pts</div></span>
          <button class="vtx-b" data-shpa="edit" data-id="${s.id}" title="Edit corners">✎</button>
          <button class="vtx-b" data-shpa="del" data-id="${s.id}" title="Delete">✕</button>
        </div>`
      )
      .join("");

    box.innerHTML = `
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="btnDrawBoundary">Draw property line</button>
        <button class="btn btn-ghost btn-sm" id="btnDrawTrail">Draw trail</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="btnCornerBoundary">Property line by coords</button>
        <button class="btn btn-ghost btn-sm" id="btnCornerTrail">Trail by coords</button>
      </div>
      ${
        (state.shapes || []).some((s) => s.kind === "trail")
          ? `<div class="hint">Tap the trail icon on the map (top right) to show or hide all trails — nothing gets deleted.</div>`
          : ""
      }
      ${
        shapeRows
          ? `<label class="fld">Drawn lines</label><div class="shape-list">${shapeRows}</div>
             <div class="btn-row"><button class="btn btn-sm btn-danger" id="btnClearShapes">Delete all lines</button></div>`
          : `<div class="hint">No property lines or trails yet.</div>`
      }
      <div class="hint">You can also tap a line on the map to rename, delete, or edit it.</div>`;
    $("#btnDrawBoundary").onclick = () => startDraw("boundary");
    $("#btnDrawTrail").onclick = () => startDraw("trail");
    $("#btnCornerBoundary").onclick = () => startCornerEditor("boundary");
    $("#btnCornerTrail").onclick = () => startCornerEditor("trail");

    $$("[data-shpa]").forEach((b) => {
      b.onclick = () => {
        const s = state.shapes.find((x) => x.id === b.dataset.id);
        if (!s) return;
        if (b.dataset.shpa === "edit") startCornerEditor(s.kind, s);
        else {
          if (!confirm(`Delete "${s.label || (s.kind === "boundary" ? "property line" : "trail")}"?`)) return;
          state.shapes = state.shapes.filter((x) => x.id !== s.id);
          saveState();
          shapesChanged();
        }
      };
    });
    $$(".shape-row").forEach((n) => {
      n.onclick = (e) => {
        if (e.target.closest("[data-shpa]")) return;
        const s = state.shapes.find((x) => x.id === n.dataset.shp);
        if (s && s.latlngs.length) {
          map.fitBounds(L.latLngBounds(s.latlngs), { padding: [40, 40], maxZoom: 16 });
        }
      };
    });
    const cs = $("#btnClearShapes");
    if (cs)
      cs.onclick = () => {
        if (!confirm(`Delete all ${state.shapes.length} lines?`)) return;
        state.shapes = [];
        saveState();
        shapesChanged();
      };
    return;
  }

  const rows = cornerEd.verts
    .map(
      (v, i) => `<div class="vtx-row">
        <span class="vtx-n">${i + 1}</span>
        <input type="text" id="mv-lat-${i}" value="${v && isFinite(v[0]) ? (+v[0]).toFixed(6) : ""}" placeholder="lat" />
        <input type="text" id="mv-lng-${i}" value="${v && isFinite(v[1]) ? (+v[1]).toFixed(6) : ""}" placeholder="lng" />
        <button class="vtx-b" data-mv="up" data-i="${i}" title="Move up">↑</button>
        <button class="vtx-b" data-mv="del" data-i="${i}" title="Remove">✕</button>
      </div>`
    )
    .join("");

  box.innerHTML = `
    <div class="hint">${cornerEd.kind === "boundary" ? "Property line" : "Trail"} corners — type or paste <code>lat, lng</code>, drag the numbered handles on the map, or tap the map to add.</div>

      renderMapTools();
      refreshCornerEdit();

  $("#mvAddMe").onclick = () => {
    if (meLatLng) { cornerEd.verts.push(meLatLng.slice()); renderMapTools(); refreshCornerEdit(); }

  };
  $("#mvParsePaste").onclick = () => {
    const lines = ($("#mvPaste").value || "").split(/[\n;]+/).map((s) => s.trim()).filter(Boolean);
    let added = 0;
    lines.forEach((l) => { const c = parseCoords(l); if (c) { cornerEd.verts.push(c); added++; } });
    if (!added) { toast("No coordinates recognised"); return; }
    $("#mvPaste").value = "";
    renderMapTools();
    refreshCornerEdit(true);
    toast(`Added ${added} points`);
  };
  $("#mvLabel").onchange = (e) => { cornerEd.label = e.target.value; };
  $("#mvSave").onclick = commitCornerEditor;
  $("#mvCancel").onclick = cancelCornerEditor;
}

/* padded bounds so a tight zoom still covers the whole property */
function paddedBounds() {
  const b = map.getBounds();
  return b.pad(0.15);
}

/* ---- offline maps: predownload the current view across a working zoom range ---- */
const OFFLINE_ZOOMS = [13, 14, 15, 16, 17];
function lngLatToTile(lng, lat, z) {
  const n = Math.pow(2, z);
  const x = Math.floor(((lng + 180) / 360) * n);
  const rad = (lat * Math.PI) / 180;
  const y = Math.floor(((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * n);
  return { x, y };
}
function planOfflineDownload() {
  const bounds = paddedBounds();
  const nw = bounds.getNorthWest(), se = bounds.getSouthEast();
  const name = state.settings.layer || "Satellite";
  const list = [];
  OFFLINE_ZOOMS.forEach((z) => {
    const p1 = lngLatToTile(nw.lng, nw.lat, z), p2 = lngLatToTile(se.lng, se.lat, z);
    const x0 = Math.min(p1.x, p2.x), x1 = Math.max(p1.x, p2.x);
    const y0 = Math.min(p1.y, p2.y), y1 = Math.max(p1.y, p2.y);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) list.push({ z, x, y });
  });
  return { name, list };
}

let offlineBusy = false;
async function downloadOfflineArea() {
  if (offlineBusy) return;
  const { name, list } = planOfflineDownload();
  if (list.length > 2500) {
    toast("Zoom in a bit first — that area is too big to grab in one go");
    return;
  }
  const mb = Math.max(1, Math.round((list.length * 9) / 1024));
  if (!confirm(`Download ~${list.length} map tiles (roughly ${mb} MB) for offline use in this area?`)) return;
  offlineBusy = true;
  renderOfflinePanel();
  const layer = layerObjs[name];
  let done = 0, failed = 0, idx = 0;
  async function worker() {
    while (idx < list.length) {
      const item = list[idx++];
      const key = tileKey(name, item.z, item.x, item.y);
      if (!(await getTileBlob(key))) {
        try {
          const r = await fetch(layer.getTileUrl(item), { mode: "cors" });
          if (r.ok) await putTileBlob(key, await r.blob());
          else failed++;
        } catch (e) { failed++; }
      }
      done++;
      const s = $("#offlineStatus");
      if (s) s.textContent = `Downloading… ${done} / ${list.length}`;
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  offlineBusy = false;
  toast(failed ? `Saved — ${failed} tile${failed === 1 ? "" : "s"} didn't come through` : "Offline maps saved for this area");
  renderOfflinePanel();
}

function renderOfflinePanel() {
  const box = $("#offlineBox");
  if (!box) return;
  box.innerHTML = `
    <div class="hint" id="offlineStatus">${offlineBusy ? "Working…" : "Checking what's saved…"}</div>
    <div class="btn-row">
      <button class="btn btn-sm" id="btnDownloadOffline"${offlineBusy ? " disabled" : ""}>Download this view for offline</button>
      <button class="btn btn-sm btn-ghost" id="btnClearOffline">Clear offline maps</button>
    </div>
    <div class="hint">Grabs the <b>${esc(state.settings.layer || "Satellite")}</b> tiles for the area you're looking at, zoomed out to zoomed in. Do this on wifi before you head out — it also happens quietly on its own for any spot you've simply looked at while online.</div>`;
  if (!offlineBusy)
    countTiles().then((n) => {
      const s = $("#offlineStatus");
      if (s && !offlineBusy) s.textContent = n ? `${n} tiles saved for offline` : "No tiles saved yet";
    });
  const db = $("#btnDownloadOffline");
  if (db) db.onclick = downloadOfflineArea;
  const cb = $("#btnClearOffline");
  if (cb)
    cb.onclick = async () => {
      if (!confirm("Delete all saved offline map tiles?")) return;
      await clearTiles();
      renderOfflinePanel();
      toast("Offline maps cleared");
    };
}

async function loadTerrainForView(opts) {
  opts = opts || {};
  if (!window.DPTerrain) {
    toast("Terrain engine not available");
    return;
  }
  if (terrainBusy) return;
  terrainBusy = true;
  renderTerrainPanel();
  try {
    await DPTerrain.load(paddedBounds(), {
      zoom: state.settings.terrainZoom || 14,
      name: opts.name, // undefined => terrain.js auto-names "Area N"
      replaceId: opts.replaceId,
      onProgress: (m) => {
        const s = $("#terrainStatus");

      },

function terrainReadoutPopup(latlng) {
  const s = DPTerrain.sampleAt(latlng.lat, latlng.lng);
  if (!s) {
    L.popup().setLatLng(latlng).setContent("Outside the loaded terrain area").openOn(map);
    return;
  }
  const th = DPTerrain.thermalAt(latlng.lat, latlng.lng, huntPhase());
  const ft = Math.round(s.elev * 3.28084);
  L.popup()
    .setLatLng(latlng)
    .setContent(
      `<div style="font-size:12.5px;line-height:1.6">
        <b>${esc(s.landformName)}</b><br>
        Elevation ${ft} ft (${Math.round(s.elev)} m)<br>
        Slope ${s.slopeDeg.toFixed(0)}° · faces ${degToCompass8(s.aspectDeg)}<br>
        ${
          th && th.strength >= 0.15
            ? `Thermal now: drifts <b>from ${degToCompass8(th.fromDeg)}</b> (${Math.round(th.strength * 100)}%)`
            : "Thermal: negligible here"
        }
      </div>`
    )
    .openOn(map);
}

/* ---- scout: stand reliability + terrain candidates ---- */
let scoutCandidates = [];

function clearScoutMarkers() {
  scoutMarkers.forEach((m) => map.removeLayer(m));
  scoutMarkers = [];

function workableWinds(corridorDeg) {
  // corridorDeg is a travel axis (0-180). Winds aligned with it blow along the
  // corridor (marginal); crosswinds let you sit the downwind side.
  return DIRS8.filter((d, i) => {
    const a1 = angDiff(i * 45, corridorDeg);
    const a2 = angDiff(i * 45, corridorDeg + 180);
    return Math.min(a1, a2) > 28;
  });
}

function accessNote(lat, lng) {
  const yd = (a, b) =>
    map.distance(a, b) * 1.09361;
  let nearest = Infinity;
  const check = (ll) => { const d = yd([lat, lng], ll); if (d < nearest) nearest = d; };
  pShapes().forEach((sh) => sh.latlngs.forEach(check));
  pStands().forEach((s) => check([s.lat, s.lng]));
  if (nearest === Infinity) return "no trails or stands mapped for reference";
  const n = Math.round(nearest);
  if (n < 120) return `~${n} yd from a trail/stand — easy in and out`;
  if (n < 280) return `~${n} yd from the nearest trail/stand — plan a quiet entry`;
  return `~${n} yd from anything mapped — scout your access before you commit`;
}

function scoutIcon() {
  return L.divIcon({ className: "", html: `<div class="scout-pin">⚑</div>`, iconSize: [22, 22], iconAnchor: [4, 20] });
}

function destPoint(lat, lng, brgDeg, m) {
  const r = (brgDeg * Math.PI) / 180;
  return [
    lat + (m * Math.cos(r)) / 111320,
    lng + (m * Math.sin(r)) / (111320 * Math.cos((lat * Math.PI) / 180)),
  ];
}

/* plain-English "why this spot" for a scout candidate */
function scoutReasoning(cand) {
  const T = window.DPTerrain;
  if (!T || !T.current) return [];
  const LF = T.LF;
  const out = [];
  const axisName = `${degToCompass8(cand.corridorDeg)}–${degToCompass8((cand.corridorDeg + 180) % 360)}`;
  const phase = huntPhase();

  // ends of the corridor — which way is up (bedding) vs down (food/water)
  const eA = T.sampleAt(...destPoint(cand.lat, cand.lng, cand.corridorDeg, 110));
  const eB = T.sampleAt(...destPoint(cand.lat, cand.lng, (cand.corridorDeg + 180) % 360, 110));
  let bedBrg = null, feedBrg = null, relief = 0;
  if (eA && eB) {
    relief = Math.abs(eA.elev - eB.elev);
    if (relief > 3) {
      bedBrg = eA.elev > eB.elev ? cand.corridorDeg : (cand.corridorDeg + 180) % 360;
      feedBrg = (bedBrg + 180) % 360;
    }
  }

  switch (cand.landform) {
    case LF.SADDLE:
      out.push("This is a saddle — the low gap where deer cross the ridge without climbing over the top. A natural pinch point that concentrates anything moving between the two sides.");
      out.push(`Expect deer to funnel through here roughly ${axisName}, dropping out of one drainage and into the other.`);
      break;
    case LF.DRAW:
      out.push("A draw. Deer favor drainages — the cut gives them cover and the walking is easy.");
      out.push(`Movement runs up and down the draw, about ${axisName}.`);
      break;
    case LF.BENCH:
      out.push("A bench — a flat shelf partway up the slope. Deer both bed on these and travel them, holding the contour instead of grinding straight up the hill.");
      out.push(`Travel along the bench runs about ${axisName}.`);
      break;
    case LF.SPUR:
      out.push("A spur ridge point. Deer travel the spine and use the tip to scent-check both draws below — bucks especially.");
      break;
    case LF.RIDGE:
      out.push("A ridgetop travel route. Deer use the high line to move and read the wind, but it's more exposed than a saddle or a draw.");
      break;
    default:
      out.push(`${cand.landformName} — not much terrain here to concentrate deer. Movement will lean on cover and food edges the app can't see; scout it on foot.`);
  }

  if (bedBrg != null) {
    out.push(
      `Higher ground — likely bedding — is to the ${degToCompass8(bedBrg)}; lower ground with food and water to the ${degToCompass8(feedBrg)}. ` +
      (phase === "am"
        ? "This morning deer should be working up toward bed — hunt the bedding side of the spot."
        : "This evening deer should be dropping toward food — hunt the food side of the spot.")
    );
  } else if (eA && eB) {
    out.push("Both ends of this corridor sit at about the same elevation — it's a lateral travel route, not a bed-to-feed run.");
  }

  // bedding pointer
  const bedProbe = bedBrg != null ? bedBrg : cand.corridorDeg;
  const bp = T.sampleAt(...destPoint(cand.lat, cand.lng, bedProbe, 150));
  if (bp) {
    if (bp.landform === LF.SPUR || bp.landform === LF.RIDGE)
      out.push(`Look for beds on the ${degToCompass8(bedProbe)} spur/ridge ~160 yd off — bucks bed on points where they can watch downhill and smell anything coming up.`);
    else if (bp.landform === LF.BENCH)
      out.push(`There's a bench ~160 yd to the ${degToCompass8(bedProbe)} — worth checking for beds.`);
    else if (bp.aspectDeg >= 120 && bp.aspectDeg <= 240)
      out.push(`The slope ~160 yd to the ${degToCompass8(bedProbe)} faces roughly south — a sun-catching bedding face once it turns cold.`);
  }

  // setup + thermal
  const th = T.thermalAt(cand.lat, cand.lng, phase);
  let setup = "Set up ~30–40 yd off the spot on the downwind side — the day's wind picks which side.";
  if (th && th.strength >= 0.2)
    setup +=
      phase === "am"
        ? " Thermals count here: at first light your scent (and the deer's) drains downhill — keep the low side clear of where you expect them."
        : " Thermals count here: in the last hour your scent lifts uphill — keep the high side clear of where you expect them.";
  out.push(setup);

  return out;
}

function boundaryPolys() {
  // scout scopes to the property line you're currently in; else every line
  const b = boundaryById(activeBoundaryId);
  if (b) return [b.latlngs];
  return boundaryShapes().map((s) => s.latlngs);
}

function runScout() {
  if (!window.DPTerrain || !DPTerrain.current) {
    toast("Load terrain first (Terrain panel)");
    return;
  }
  clearScoutMarkers();
  const polys = state.settings.scoutInsideProperty === false ? [] : boundaryPolys();
  scoutCandidates = DPTerrain.scoutSpots({
    exclude: pStands().map((s) => ({ lat: s.lat, lng: s.lng })),
    polygons: polys,
    max: 8,
  });
  scoutCandidates._scopedToProperty = polys.length > 0;
  scoutCandidates.forEach((cand, idx) => {
    const m = L.marker([cand.lat, cand.lng], { icon: scoutIcon() }).addTo(map);
    m.on("click", () => { if (measure) { addMeasurePoint(m.getLatLng()); return; } scoutPopup(cand, idx); });
    scoutMarkers.push(m);
  });
  renderScoutPanel();
  if (scoutCandidates.length) toast(`${scoutCandidates.length} spots flagged`);
  else toast("No standout terrain in this area");
}

function scoutPopup(cand, idx) {
  const winds = workableWinds(cand.corridorDeg);
  const axis = `${degToCompass8(cand.corridorDeg)}–${degToCompass8((cand.corridorDeg + 180) % 360)}`;
  const div = document.createElement("div");
  const why = scoutReasoning(cand)
    .map((s) => `<p style="margin:5px 0">${esc(s)}</p>`)
    .join("");
  div.innerHTML =
    `<div style="font-size:12.5px;line-height:1.55;max-height:46vh;overflow-y:auto">
      <div style="font-weight:600;margin-bottom:2px">${esc(cand.landformName)}${cand.marginal ? " (marginal)" : ""} · scout score ${cand.score}</div>
      <div style="color:#9aa7b2">Travel axis ${axis} · works ${winds.length} winds${winds.length ? " (" + winds.join(" ") + ")" : ""} · ${esc(accessNote(cand.lat, cand.lng))}</div>
      ${why}
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn btn-sm" data-a="add">Add stand here</button>
      <button class="btn btn-sm btn-ghost" data-a="copy">Copy coords</button>
    </div>`;
  div.querySelector('[data-a="add"]').onclick = () => {
    // carry the scout's read onto the new stand: playable winds + the travel-axis
    // approach directions + the plain-English "why" in the notes
    const axisDirs = [
      degToCompass8(cand.corridorDeg),
      degToCompass8((cand.corridorDeg + 180) % 360),
    ].filter((d, i, a) => a.indexOf(d) === i);
    const rz = scoutReasoning(cand);
    createStand(cand.lat, cand.lng, {
      goodWinds: workableWinds(cand.corridorDeg),
      deerDirs: axisDirs,
      notes: rz.length ? "From Scout — " + rz.join(" ") : "",
    });
    toast("Stand added with the scout's winds + deer direction");
    map.closePopup();
  };
  div.querySelector('[data-a="copy"]').onclick = () => copyCoords(cand.lat, cand.lng);
  L.popup({ minWidth: 260, maxWidth: 300 }).setLatLng([cand.lat, cand.lng]).setContent(div).openOn(map);
}

function renderScoutPanel() {
  const box = $("#scoutBox");
  if (!box) return;

  const rel = pStands()
    .map((st) => ({ st, r: standReliability(st) }))
    .sort((a, b) => (b.r.solid.length || 0) - (a.r.solid.length || 0));

  const relHTML = rel.length
    ? rel
        .map(
          ({ st, r }) => `<div class="rel-row">
        <span class="rel-badge ${RELIA_CLASS[r.label] || "n"}">${esc(r.label)}</span>
        <span class="rel-nm">${esc(st.name)}
          <div class="ty">${
            r.solid.length ? "solid on " + r.solid.join(" ") : r.label === "Not set" ? "needs deer direction / good winds" : "narrow wind window"
          }</div></span>
      </div>`
        )
        .join("")
    : `<div class="hint">Add stands to see which ones are worth a permanent set.</div>`;

  const candHTML = scoutCandidates.length
    ? scoutCandidates
        .map((cand, i) => {
          const winds = workableWinds(cand.corridorDeg);
          return `<div class="scout-row ${cand.marginal ? "marginal" : ""}" data-scout="${i}">
        <span class="score ${cand.score >= 68 ? "g" : cand.score >= 50 ? "m" : "b"}" style="width:30px;height:30px;font-size:12px">${cand.score}</span>
        <span class="sign-nm">${esc(cand.landformName)}${cand.marginal ? " · marginal" : ""}
          <div class="ty">${degToCompass8(cand.corridorDeg)}–${degToCompass8((cand.corridorDeg + 180) % 360)} travel axis · works ${winds.length} winds</div></span>
      </div>`;
        })
        .join("")
    : "";

  const hasBoundary = boundaryPolys().length > 0;
  const insideOn = state.settings.scoutInsideProperty !== false;

  box.innerHTML =
    `<div class="hint" style="margin-bottom:4px">How steadily each stand scores across all 8 winds.</div>` +
    relHTML +
    `<div class="btn-row" style="margin-top:12px">
      <button class="btn btn-sm" id="btnRunScout">${scoutCandidates.length ? "Re-scan terrain" : "Scout the terrain"}</button>
      ${scoutCandidates.length ? `<button class="btn btn-sm btn-ghost" id="btnClearScout">Clear</button>` : ""}
    </div>
    ${
      hasBoundary
        ? `<label class="fld"><input type="checkbox" id="scoutInside" ${insideOn ? "checked" : ""}/> Only inside the drawn property line</label>`
        : `<div class="hint">Draw a property line (Map panel) to keep the scout inside your ground.</div>`
    }
    <div class="hint">Finds ridge, draw and saddle spots that concentrate deer.${
      scoutCandidates._scopedToProperty ? " Scoped to your property line." : ""
    }</div>` +
    candHTML;

  $("#btnRunScout").onclick = runScout;
  const si = $("#scoutInside");
  if (si)
    si.onchange = (e) => {
      state.settings.scoutInsideProperty = e.target.checked;
      saveState();
      if (scoutCandidates.length) runScout();
    };
  const cs = $("#btnClearScout");
  if (cs)
    cs.onclick = () => {
      clearScoutMarkers();
      scoutCandidates = [];
      renderScoutPanel();
    };
  $$(".scout-row", box).forEach((n) => {
    n.onclick = () => {
      const cand = scoutCandidates[+n.dataset.scout];
      if (!cand) return;
      map.setView([cand.lat, cand.lng], Math.max(map.getZoom(), 16));
      scoutPopup(cand, +n.dataset.scout);
      if (window.matchMedia("(max-width:640px)").matches) hidePanel();
    };
  });
}

/* ---- placement controls (shared by stands + signs) ---- */
let placeCoordMode = false;

function placeControlsHTML(kind, type) {
  const active = placing && placing.kind === kind && (kind !== "sign" || placing.type === type);
  if (!active) {
    const lbl =
      kind === "stand" ? "+ Add stand" : kind === "harvest" ? "+ Log a harvest" : "+ Add " + signDef(type).label.toLowerCase();
    return `<div class="btn-row"><button class="btn btn-sm" data-place="${kind}" data-ptype="${type || ""}">${lbl}</button></div>`;
  }
  return `<div class="place-box">
    <div class="hint">Placing — pick one:</div>
    <div class="btn-row">
      <button class="btn btn-sm" data-pa="map">Tap map</button>
      <button class="btn btn-sm" data-pa="me">Use my location</button>
      <button class="btn btn-sm btn-ghost" data-pa="coord">Paste coords</button>
      <button class="btn btn-sm btn-ghost" data-pa="cancel">✕</button>
    </div>
    ${placeCoordMode ? `<div class="row" style="margin-top:6px">
      <input type="text" id="placeCoordInput" placeholder="38.9289, -88.9553" />
      <button class="btn btn-sm" data-pa="coordgo">Go</button>
    </div>` : ""}
  </div>`;
}

function wirePlaceControls(root) {
  $$("[data-place]", root).forEach((b) => {
    b.onclick = () => {
      placeCoordMode = false;
      beginPlace(b.dataset.place, b.dataset.ptype || null);
    };
  });
  $$("[data-pa]", root).forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.pa;
      if (a === "cancel") { placeCoordMode = false; cancelPlace(); }
      else if (a === "map") toast("Tap the map to place it");
      else if (a === "me") placeAtMe();
      else if (a === "coord") { placeCoordMode = !placeCoordMode; renderStands(); renderSignsPanel(); renderHarvestPanel(); }
      else if (a === "coordgo") {
        const c = parseCoords($("#placeCoordInput").value);
        if (!c) { toast("Couldn't read those coordinates"); return; }
        placeCoordMode = false;
        finalizePlace(c[0], c[1]);
      }
    };
  });
}

/* ---- field-sign panel ---- */
function renderSignsPanel() {
  const box = $("#signsBox");
  if (!box) return;
  const signs = pSigns();
  const byType = {};
  signs.forEach((s) => (byType[s.type] = (byType[s.type] || 0) + 1));

  const list = signs.length
    ? signs
        .slice()
        .sort((a, b) => (a.date < b.date ? 1 : -1))
        .map((s) => {
          const d = signDef(s.type);
          const dt = new Date((s.date || todayISO()) + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
          return `<div class="sign-row" data-sign="${s.id}">
            <span class="sign-chip" style="background:${d.color}">${d.letter}</span>
            <span class="sign-nm">${d.label}<div class="ty">${dt}${s.note ? " · " + esc(s.note.slice(0, 40)) : ""}</div></span>
          </div>`;
        })
        .join("")
    : `<div class="hint">No sign marked yet. Add rubs, scrapes, bedding, cameras and tracks as you find them.</div>`;

  const adder = SIGN_TYPES.map((t) => {
    const on = placing && placing.kind === "sign" && placing.type === t.key;
    return on
      ? ""
      : `<button class="btn btn-sm btn-ghost" data-place="sign" data-ptype="${t.key}">+ ${t.label}</button>`;
  }).join(" ");

  const activeSign = placing && placing.kind === "sign";
  box.innerHTML =
    list +
    (activeSign
      ? placeControlsHTML("sign", placing.type)
      : `<div class="hint" style="margin-top:8px">Add:</div><div class="sign-adder">${adder}</div>`);

  $$(".sign-row", box).forEach((n) => {
    n.onclick = () => {
      const s = state.signs.find((x) => x.id === n.dataset.sign);
      if (!s) return;
      map.setView([s.lat, s.lng], Math.max(map.getZoom(), 16));
      signPopup(s, signMarkers[s.id]);
      if (window.matchMedia("(max-width:640px)").matches) hidePanel();
    };
  });
  wirePlaceControls(box);
}

/* ---- research & scoring panel ---- */
let researchExpanded = {};
let researchTuneOpen = false;

function currentEvForPanel() {
  // evaluate against the selected stand, else the first stand, else null
  const st =
    pStands().find((s) => s.id === selectedStandId) || pStands()[0];
  if (!st) return null;
  const r = scoreStand(st);
  return { st, r };
}

function renderResearchPanel() {
  const box = $("#researchBox");
  if (!box || !window.DPResearch) return;
  const s = state.settings;
  const presetKey = s.weights ? "custom" : s.preset || "balanced";

  const presetSel =
    `<label class="fld">Preset</label>
     <select id="presetSel">
       ${Object.entries(DPResearch.PRESETS)
         .map(([k, p]) => `<option value="${k}" ${presetKey === k ? "selected" : ""}>${p.label}</option>`)
         .join("")}
       <option value="custom" ${presetKey === "custom" ? "selected" : ""}>Custom</option>
     </select>
     <div class="hint">${
       presetKey === "custom"
         ? "Your own weights. Pick a preset to reset."
         : esc(DPResearch.PRESETS[presetKey] ? DPResearch.PRESETS[presetKey].note : "")
     }</div>`;

  const { weights } = scoringWeights();
  const pick = currentEvForPanel();
  const evDrivers = pick && pick.r.ev ? pick.r.ev.drivers : null;

  const cards = DPResearch.DRIVERS.map((drv) => {
    const w = weights[drv.id] != null ? weights[drv.id] : 1;
    const contrib = evDrivers ? evDrivers.find((d) => d.id === drv.id) : null;
    const contribStr = contrib
      ? contrib.na
        ? '<span class="rc-na">n/a</span>'
        : `<span class="rc-val ${contrib.weighted > 0 ? "plus" : contrib.weighted < 0 ? "minus" : ""}">${
            contrib.weighted > 0 ? "+" : ""
          }${contrib.weighted}</span>`
      : "";
    const open = researchExpanded[drv.id];
    return `<div class="rcard">
      <div class="rc-head" data-rexp="${drv.id}">
        <span class="rc-name">${esc(drv.name)}</span>
        <span class="rc-tier tier-${drv.tier}">${drv.tier}</span>
        ${contribStr}
        <span class="rc-chev">${open ? "▾" : "▸"}</span>
      </div>
      <input type="range" class="rc-w" data-rw="${drv.id}" min="0" max="2" step="0.05" value="${w}" />
      <div class="rc-wlabel">weight ${Math.round(w * 100)}%</div>
      ${
        open
          ? `<div class="rc-body">
              <p><b>Claim.</b> ${esc(drv.claim)}</p>
              <p><b>Studies.</b> ${esc(drv.studies)}</p>
              <p><b>Where it's disputed.</b> ${esc(drv.dissent)}</p>
              ${
                drv.id === "windSpeed"
                  ? `<label class="fld">Wind model</label>
                     <div class="seg" id="windModelSeg">
                       <button data-wm="pennstate" class="${(s.windModel || "pennstate") === "pennstate" ? "on" : ""}">Penn State</button>
                       <button data-wm="traditional" class="${s.windModel === "traditional" ? "on" : ""}">Traditional</button>
                     </div>`
                  : ""
              }
            </div>`
          : ""
      }
    </div>`;
  }).join("");

  box.innerHTML =
    presetSel +
    `<div class="btn-row"><button class="btn btn-sm btn-ghost" id="btnTuneDrivers">${
      researchTuneOpen ? "Hide the drivers" : "Tune individual drivers"
    }</button></div>` +
    (researchTuneOpen
      ? `<div class="hint" style="margin-top:8px">Contributions shown are for <b>${
          pick ? esc(pick.st.name) : "—"
        }</b> on the selected day. Sliders and the wind model update every score live.</div>` + cards
      : "");

  $("#btnTuneDrivers").onclick = () => {
    researchTuneOpen = !researchTuneOpen;
    renderResearchPanel();
  };
  $("#presetSel").onchange = (e) => {
    const v = e.target.value;
    if (v === "custom") {
      state.settings.weights = Object.assign({}, scoringWeights().weights);
    } else {
      state.settings.preset = v;
      state.settings.weights = null;
      const pw = DPResearch.presetWeights(v);
      state.settings.windModel = pw.windModel;
    }
    saveState();
    renderResearchPanel();
    recomputeScoring();
  };
  $$("[data-rexp]").forEach((h) => {
    h.onclick = () => {
      const id = h.dataset.rexp;
      researchExpanded[id] = !researchExpanded[id];
      renderResearchPanel();
    };
  });
  $$("[data-rw]").forEach((sl) => {
    sl.oninput = (e) => {
      const id = e.target.dataset.rw;
      if (!state.settings.weights)
        state.settings.weights = Object.assign({}, scoringWeights().weights);
      state.settings.weights[id] = +e.target.value;
      state.settings.preset = null;
      const lbl = e.target.parentNode.querySelector(".rc-wlabel");
      if (lbl) lbl.textContent = `weight ${Math.round(e.target.value * 100)}%`;
      saveState();
      recomputeScoringDebounced();
    };
  });
  const wm = $("#windModelSeg");
  if (wm)
    $$("button", wm).forEach((b) => {
      b.onclick = () => {
        state.settings.windModel = b.dataset.wm;
        saveState();
        renderResearchPanel();
        recomputeScoring();
      };
    });
}

let _recomputeT = null;
function recomputeScoringDebounced() {
  clearTimeout(_recomputeT);
  _recomputeT = setTimeout(recomputeScoring, 120);
}
function recomputeScoring() {
  renderStands();
  refreshTerrainOverlay();
  updateHuntMomentHint();
  // refresh just the contribution numbers without losing slider focus
  const pick = currentEvForPanel();
  if (pick && pick.r.ev) {
    pick.r.ev.drivers.forEach((d) => {
      const card = document.querySelector(`[data-rexp="${d.id}"]`);
      if (!card) return;
      let val = card.querySelector(".rc-val, .rc-na");
      const html = d.na
        ? '<span class="rc-na">n/a</span>'
        : `<span class="rc-val ${d.weighted > 0 ? "plus" : d.weighted < 0 ? "minus" : ""}">${
            d.weighted > 0 ? "+" : ""
          }${d.weighted}</span>`;
      if (val) val.outerHTML = html;
    });
  }
}
