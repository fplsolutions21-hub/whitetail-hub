<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;

<style>
/* ---------- Deer Planner UI ---------- */
:root {
  --bg: #14181c;
  --panel: #1c2228;
  --panel-2: #232b33;
  --line: #333d47;
  --text: #e6ebef;
  --text-dim: #9aa7b2;
  --accent: #e0863a;
  --accent-dim: #7a4d24;
  --good: #4caf6d;
  --mid: #d8a13a;
  --bad: #d8574a;
  --link: #6fb1e0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }

#errbar {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; z-index: 4000;
  background: #7a1f1a; color: #ffe9e6;
  font-size: 12px; line-height: 1.4;
  padding: 8px 12px;
  border-bottom: 1px solid #a83a32;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#app {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; overflow: hidden;
}
#map { flex: 1 1 auto; height: 100%; background: #0c0f12; }

/* ---------- panel ---------- */
.panel {
  width: 360px;
  max-width: 88vw;
  height: 100%;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: margin-left .2s ease;
  z-index: 1200;
}
#app.panel-hidden .panel { margin-left: calc(-1 * min(360px, 88vw)); }

.panel-toggle {
  position: absolute;
  top: 10px; left: 10px;
  z-index: 1300;
  width: 38px; height: 38px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: none;
  box-shadow: 0 1px 6px rgba(0,0,0,.4);
}
#app.panel-hidden .panel-toggle { display: block; }

.panel-head {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px;
  border-bottom: 1px solid var(--line);
}
.panel-head h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
.panel-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.panel-sub select {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  color: var(--text); border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 12.5px;
}

.panel-body { flex: 1 1 auto; overflow-y: auto; padding: 6px 0 16px; }
.panel-foot {
  border-top: 1px solid var(--line);
  padding: 8px 12px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-dim);
}
.build-tag { margin-left: auto; opacity: .7; }

/* ---------- sections ---------- */
.sec { border-bottom: 1px solid var(--line); }
.sec-head {
  width: 100%;
  background: none; border: 0;
  color: var(--text);
  font: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .6px;
  padding: 11px 16px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
}
.sec-head .chev { margin-left: auto; color: var(--text-dim); transition: transform .15s; }
.sec.collapsed .chev { transform: rotate(-90deg); }
.sec-body { padding: 4px 16px 14px; }
.sec.collapsed .sec-body { display: none; }

/* nested sub-sections (inside Scouting) */
.sec[data-sec="scouting"] > .sec-body { padding: 0 12px 8px; }
.subsec { border-bottom: 1px solid var(--line); }
.subsec:last-child { border-bottom: 0; }
.subsec > .sec-head {
  padding: 9px 4px; font-size: 10.5px; font-weight: 600;
  color: var(--text-dim); letter-spacing: .5px;
}
.subsec > .sec-body { padding: 0 4px 12px; }

/* ---------- controls ---------- */
label.fld { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
input[type=text], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 8px;
  font: inherit; font-size: 13px;
}
textarea { resize: vertical; min-height: 44px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.btn {
  background: var(--accent);
  color: #17130e;
  border: 0; border-radius: 6px;
  padding: 8px 12px;
  font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
.btn-ghost:hover { color: var(--text); }
.btn-sm { padding: 5px 9px; font-size: 12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button {
  flex: 1; background: var(--panel-2); border: 0; color: var(--text-dim);
  padding: 7px 4px; font: inherit; font-size: 12px; cursor: pointer;
}
.seg button.on { background: var(--accent-dim); color: var(--text); }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
.chip {
  text-align: center; padding: 6px 0; font-size: 12px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2); color: var(--text-dim); cursor: pointer; user-select: none;
}
.chip.on { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

.hint { font-size: 11.5px; color: var(--text-dim); line-height: 1.45; margin-top: 8px; }
.hint code { background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }

/* ---------- weather card ---------- */
.wx { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.wx-now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wx-temp { font-size: 22px; font-weight: 600; }
.wx-wind { font-size: 14px; }
.wx-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.wx-trend .up { color: var(--good); }
.wx-trend .down { color: var(--bad); }
.wx-hours { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
.wx-hr { flex: 0 0 auto; text-align: center; font-size: 11px; color: var(--text-dim); min-width: 44px; }
.wx-hr b { display: block; color: var(--text); font-size: 12px; }
.wx-hr .arr { display: block; font-size: 15px; color: var(--accent); }
.wx-hr.win { background: var(--accent-dim); border-radius: 5px; }
.wx-stale { color: var(--mid); }

/* ---------- stands list ---------- */
.stand {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent;
}
.stand:hover { background: var(--panel-2); }
.stand.sel { background: var(--panel-2); border-color: var(--accent-dim); }
.stand .nm { flex: 1; font-size: 13px; }
.stand .ty { font-size: 11px; color: var(--text-dim); text-transform: capitalize; }
.score {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #12100c;
}
.score.g { background: var(--good); }
.score.m { background: var(--mid); }
.score.b { background: var(--bad); }
.score.n { background: var(--line); color: var(--text-dim); }

.explain { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; }
.explain .f { display: block; padding: 2px 0; }
.explain .f b { color: var(--text); font-weight: 600; }
.explain .plus { color: var(--good); }
.explain .minus { color: var(--bad); }

.best {
  font-size: 12px; color: var(--text);
  background: var(--accent-dim); border-radius: 6px;
  padding: 6px 9px; margin: 2px 0 8px;
}
.rest-tag { color: var(--mid); text-transform: none; }

.sit-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-dim);
  padding: 4px 0; border-bottom: 1px solid var(--line);
}
.sit-row span { flex: 1; }
.sit-del { background: none; border: 0; color: var(--text-dim); cursor: pointer; font-size: 12px; }
.sit-del:hover { color: var(--bad); }
.sit-form { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 8px; }
.sit-form input[type=text], .sit-form input[type=number] { margin-top: 6px; }
.sit-form .seg { flex: 1.4; }

.empty { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; padding: 8px 2px; }

/* ---- sit log ---- */
.sit-active {
  background: var(--panel-2); border: 1px solid var(--accent-dim);
  border-radius: 8px; padding: 10px 12px;
}
.sit-hd { font-size: 13px; }
.sit-elapsed { float: right; color: var(--text-dim); font-size: 11.5px; }
.sit-wind { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.obs-list, .sit-list { margin-top: 6px; }
.sit-row.spooked span { color: var(--mid); }
.sit-row.expandable { cursor: pointer; }
.sit-row.expandable:hover span { color: var(--text); }
.sit-obs-expand { padding: 3px 0 8px 12px; border-bottom: 1px solid var(--line); }
.sit-active textarea, #sitNote { margin-top: 8px; }
.sit-form .chips, .sit-form .seg { margin-top: 4px; }

/* ---------- recommendation + research ---------- */
.rec {
  font-size: 12.5px; line-height: 1.55; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 8px 10px; margin-top: 8px;
}
details.fac { margin-top: 6px; }
details.fac summary { font-size: 11.5px; color: var(--text-dim); cursor: pointer; }
details.fac .explain { margin-top: 4px; }

.rcard { border-top: 1px solid var(--line); padding: 9px 0 10px; }
.rcard:first-of-type { border-top: 0; }
.rc-head { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; }
.rc-name { font-weight: 600; }
.rc-tier {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px;
  padding: 1px 5px; border-radius: 4px; color: #12100c;
}
.tier-strong { background: var(--good); }
.tier-mixed { background: var(--mid); }
.tier-contested { background: #c98a5b; }
.tier-weak { background: var(--line); color: var(--text-dim); }
.rc-val { margin-left: auto; font-weight: 700; font-size: 12px; }
.rc-val.plus { color: var(--good); }
.rc-val.minus { color: var(--bad); }
.rc-na { margin-left: auto; font-size: 11px; color: var(--text-dim); }
.rc-chev { color: var(--text-dim); width: 12px; text-align: center; }
.rc-w { width: 100%; margin: 6px 0 2px; }
.rc-wlabel { font-size: 10.5px; color: var(--text-dim); }
.rc-body { font-size: 11.5px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
.rc-body p { margin: 4px 0; }
.rc-body b { color: var(--text); }

.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: #262f38; color: var(--text); border: 1px solid var(--line);
  padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 3000;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }

/* ---------- map bits ---------- */
.leaflet-container { background: #0c0f12; font: inherit; }
.stand-pin {
  width: 26px; height: 26px; margin-left: -13px; margin-top: -13px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 2px solid rgba(0,0,0,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
  transition: transform .12s ease, box-shadow .12s ease;
}
.stand-pin span {
  display: block; transform: rotate(45deg);
  text-align: center; line-height: 22px; font-size: 12px; font-weight: 700; color: #12100c;
}
.stand-pin.g { background: var(--good); }
.stand-pin.m { background: var(--mid); }
.stand-pin.b { background: var(--bad); }
.stand-pin.n { background: #c9d2da; }
.stand-pin.sel { outline: 3px solid var(--accent); outline-offset: 2px; }

.sign-pin {
  width: 20px; height: 20px; margin-left: -10px; margin-top: -10px;
  border-radius: 50%; border: 2px solid rgba(0,0,0,.55);
  box-shadow: 0 1px 3px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s ease, box-shadow .12s ease;
}
.sign-pin span { font-size: 11px; font-weight: 700; color: #12100c; }

/* long-press-armed pin (about to be dragged) — scaled up with a gold ring */
.marker-armed .stand-pin { transform: rotate(-45deg) scale(1.3); box-shadow: 0 0 0 5px rgba(255,210,74,.55), 0 1px 4px rgba(0,0,0,.6); }
.marker-armed .sign-pin { transform: scale(1.3); box-shadow: 0 0 0 5px rgba(255,210,74,.55), 0 1px 3px rgba(0,0,0,.6); }
.marker-armed .harvest-pin { transform: scale(1.25); filter: drop-shadow(0 0 5px rgba(255,210,74,.85)) drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

.me-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: #4a9eff; border: 2px solid #fff;
  box-shadow: 0 0 0 rgba(74,158,255,.6); animation: mepulse 2s infinite;
}
@keyframes mepulse {
  0% { box-shadow: 0 0 0 0 rgba(74,158,255,.5); }
  70% { box-shadow: 0 0 0 14px rgba(74,158,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(74,158,255,0); }
}
.dp-locate {
  width: 34px; height: 34px; line-height: 34px;
  background: #fff; color: #333; border: 2px solid rgba(0,0,0,.2);
  border-radius: 4px; font-size: 17px; cursor: pointer; text-align: center;
  display: block;
}
.dp-locate.on { color: #1b6fd0; }
.dp-locate.has-fix { background: #e8f2ff; }
.dp-ctl {
  width: 34px; height: 34px;
  background: #fff; border: 2px solid rgba(0,0,0,.2);
  border-radius: 4px; cursor: pointer; margin-top: 6px;
  display: flex; align-items: center; justify-content: center;
}
.dp-ctl:hover { background: #eee; }

.dp-add-wrap { position: relative; }
.dp-add { font-size: 21px; font-weight: 400; color: #333; }
.dp-add-menu {
  position: absolute; right: 40px; top: 0;
  display: none; background: #fff;
  border: 2px solid rgba(0,0,0,.2); border-radius: 4px;
  overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.4);
}
.dp-add-wrap.open .dp-add-menu { display: block; }
.dp-add-menu button {
  display: flex; align-items: center; gap: 8px;
  width: 132px; padding: 8px 10px;
  background: #fff; border: 0; border-bottom: 1px solid #e4e4e4;
  font: inherit; font-size: 13px; color: #222; cursor: pointer; text-align: left;
}
.dp-add-menu button:last-child { border-bottom: 0; }
.dp-add-menu button:hover { background: #f1f1f1; }

.harvest-pin {
  width: 26px; height: 26px; margin-left: -13px; margin-top: -15px;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  transition: transform .12s ease, filter .12s ease;
}
.harvest-chip {
  flex: 0 0 auto; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}

.dp-coord {
  background: rgba(20,24,28,.82); color: #d7dde2;
  border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 8px; font-size: 11px; font-family: ui-monospace, Menlo, monospace;
  cursor: pointer; user-select: text;
}
.dp-coord:hover { color: #fff; }

.dp-ruler.on { background: #ffd24a; }
.dp-walk.on { background: #ffd24a; }
.dp-trails.off { background: #f2f2f2; }
/* while measuring, no pin can be touched at all — taps fall through to the map and
   snap to the nearest pin in code. this is the hard guarantee a pin won't get dragged. */
.leaflet-container.measuring .leaflet-marker-pane { pointer-events: none; }
.measure-seg {
  background: rgba(20,24,28,.85); color: #ffd24a;
  border: 1px solid rgba(255,210,74,.4); border-radius: 3px;
  padding: 0 4px; font-size: 10.5px; font-weight: 700; white-space: nowrap;
  transform: translate(-50%, -50%); display: inline-block;
}
.measure-total {
  background: #ffd24a; color: #17130e;
  border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 800;
  white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.5);
  transform: translate(-50%, -190%); display: inline-block;
}

/* ---- "Go to" compass HUD — fixed over the map, not part of Leaflet ---- */
.nav-compass {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 2500; display: flex; align-items: center; gap: 10px;
  background: rgba(20,24,28,.9); border: 1px solid rgba(95,208,138,.5);
  border-radius: 14px; padding: 8px 14px 8px 8px;
  box-shadow: 0 4px 18px rgba(0,0,0,.5);
}
#navArrowG { transform-origin: 50px 50px; transition: transform .25s ease; }
.nav-compass-info { display: flex; flex-direction: column; gap: 1px; align-items: flex-start; }
.nav-compass-dist { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.1; }
.nav-compass-name { font-size: 11px; color: var(--text-dim); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-compass .btn { margin-top: 3px; }

/* ---- field photos — gallery modal + full-image viewer ---- */
.photo-viewer {
  position: fixed; inset: 0; background: rgba(0,0,0,.86); z-index: 4000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.photo-viewer-inner {
  max-width: 100%; max-height: 100%; width: 420px;
  display: flex; flex-direction: column; align-items: stretch; gap: 12px;
}
.photo-viewer-inner img {
  max-width: 100%; max-height: 70vh; border-radius: 8px; object-fit: contain;
  align-self: center; background: #000;
}
.photo-viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text); }
.photo-viewer-bar { display: flex; gap: 8px; justify-content: center; }
.photo-grid { display: flex; flex-wrap: wrap; gap: 8px; overflow-y: auto; max-height: 65vh; padding: 2px; }
.photo-thumb { width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; flex: 0 0 auto; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-add {
  width: 84px; height: 84px; border-radius: 8px; border: 1px dashed rgba(255,255,255,.35);
  background: none; color: var(--text-dim); font-size: 26px; cursor: pointer; flex: 0 0 auto;
}
.photo-add:hover { background: rgba(255,255,255,.06); }

#app.panel-hidden .leaflet-top.leaflet-left { margin-left: 46px; }

/* pinned address search — sits above every collapsible section, never over the map */
.panel-search { padding: 8px 16px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.panel-search form { margin: 0; }
.panel-search-res:not(:empty) {
  margin-top: 6px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; overflow: hidden; max-height: 44vh; overflow-y: auto;
}
.panel-search-row {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  color: var(--text); font: inherit; font-size: 12px; line-height: 1.35;
  padding: 8px 10px; cursor: pointer;
}
.panel-search-row:last-child { border-bottom: 0; }
.panel-search-row:hover { background: var(--panel); }
.panel-search-hint { padding: 6px 2px 0; font-size: 12px; color: var(--text-dim); }

/* shrink the Leaflet/Esri credit strip — it's required to stay, not to be huge */
.leaflet-control-attribution {
  font-size: 9px !important; line-height: 1.3; padding: 0 4px !important;
  background: rgba(20,24,28,.65) !important; color: #b7bfc6 !important;
  max-width: 62vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.leaflet-control-attribution a { color: #cfd6db !important; }

ol.steps { margin: 4px 0; padding-left: 20px; }
ol.steps li { margin: 8px 0; font-size: 12.5px; line-height: 1.5; }
ol.steps li b { display: block; color: var(--text); }
ol.steps li span { color: var(--text-dim); }
.harvest-edit select, .harvest-edit input, .harvest-edit textarea { margin-bottom: 2px; }
.harvest-tt {
  background: rgba(20,24,28,.9); color: #fff;
  border: 1px solid #c62222; border-radius: 4px;
  font-size: 11px; font-weight: 600; padding: 1px 6px;
}
.harvest-tt::before { border-top-color: #c62222; }

.sign-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent;
}
.sign-row:hover { background: var(--panel-2); }
.sign-chip {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #12100c;
}
.sign-nm { flex: 1; font-size: 13px; }
.sign-adder { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.place-box {
  background: var(--panel-2); border: 1px solid var(--accent-dim);
  border-radius: 6px; padding: 8px; margin-top: 8px;
}

.rel-row, .scout-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 6px; border-radius: 6px; cursor: default;
}
.scout-row { cursor: pointer; }
.scout-row:hover { background: var(--panel-2); }
.rel-nm, .scout-row .sign-nm { flex: 1; font-size: 13px; }
.rel-badge {
  flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; padding: 2px 7px; border-radius: 4px; color: #12100c;
}
.rel-badge.g { background: var(--good); }
.rel-badge.m { background: var(--mid); }
.rel-badge.b { background: var(--bad); }
.rel-badge.n { background: var(--line); color: var(--text-dim); }
.scout-pin { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); color: #ffd24a; }
.scout-row.marginal { opacity: .62; }

.area-list { margin: 6px 0 4px; }
.area-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 6px; border-radius: 6px; border: 1px solid var(--line);
  margin-bottom: 5px; font-size: 12.5px;
}
.area-row.active { border-color: var(--accent-dim); background: var(--panel-2); }
.area-nm { flex: 1; }
.area-badge { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .4px; }
.area-x { background: none; border: 0; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 2px 4px; }
.area-x:hover { color: var(--text); }
.sign-edit select, .sign-edit input, .sign-edit textarea { margin-bottom: 4px; }

.vtx {
  width: 20px; height: 20px; border-radius: 50%;
  background: #ffd24a; color: #12100c;
  border: 2px solid rgba(0,0,0,.5);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-left: -10px; margin-top: -10px;
}
.vtx-list { margin: 4px 0; }
.shape-list { margin: 4px 0; }
.shape-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 4px; border-radius: 6px; cursor: pointer;
}
.shape-row:hover { background: var(--panel-2); }
.shape-nm { flex: 1; font-size: 12.5px; }
.shape-dot { flex: 0 0 auto; width: 14px; height: 3px; border-radius: 2px; }
.shape-dot.boundary { background: var(--accent); }
.shape-dot.trail { background: #c9a878; height: 0; border-top: 2px dashed #c9a878; }
.vtx-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.vtx-n {
  flex: 0 0 auto; width: 18px; text-align: center;
  font-size: 11px; color: var(--text-dim);
}
.vtx-row input { padding: 5px 6px; font-size: 12px; }
.vtx-b {
  flex: 0 0 auto; width: 24px; height: 28px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 5px; color: var(--text-dim); cursor: pointer; font-size: 12px;
}
.vtx-b:hover { color: var(--text); }

.shape-label {
  background: rgba(20,24,28,.82); color: var(--text);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 6px; font-size: 11px; white-space: nowrap;
}

/* ---------- today's read (brief) ---------- */
.brief { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.brief-hd { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.brief-rate {
  font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; color: #12100c;
}
.brief-rate.g { background: var(--good); }
.brief-rate.m { background: var(--mid); }
.brief-rate.b { background: var(--bad); }
.brief-rate.n { background: var(--line); color: var(--text-dim); }
.brief-why { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }
.brief-rows { font-size: 12.5px; line-height: 1.75; margin-top: 6px; }
.brief-rows .warn { color: var(--mid); }
.brief-warn { font-size: 11.5px; color: var(--mid); margin-top: 6px; line-height: 1.4; }
.brief-dim { color: var(--text-dim); }
.warn-tag { color: var(--mid); text-transform: none; }

.wx-toggles {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--text-dim);
}
.wx-toggles label { display: flex; align-items: center; gap: 5px; }
.wx-toggles select {
  width: auto; padding: 3px 5px; font-size: 11.5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 5px; color: var(--text);
}

/* ---------- scent drift cone + safe walk-in wedge ---------- */
.scent-flow { animation: scentflow 1.3s linear infinite; }
@keyframes scentflow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .scent-flow { animation: none; } }
.approach-tag {
  background: rgba(20,24,28,.85); color: #8ee6b0;
  border: 1px solid rgba(95,208,138,.45); border-radius: 3px;
  padding: 0 5px; font-size: 10px; font-weight: 800; letter-spacing: .3px;
  text-transform: uppercase; white-space: nowrap;
  transform: translate(-50%, -50%); display: inline-block;
}

/* ---------- recovery ---------- */
.rec-shot { font-size: 12.5px; color: var(--text); margin-bottom: 2px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip-btn {
  padding: 6px 10px; font-size: 12px; font: inherit;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; color: var(--text-dim); cursor: pointer;
}
.chip-btn.on { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }
.rec-guide {
  font-size: 12px; line-height: 1.5; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 3px solid var(--mid); border-radius: 6px;
  padding: 8px 10px; margin-top: 8px;
}
.rec-guide.go { border-left-color: var(--good); }
.rec-wait { margin-top: 5px; color: var(--text-dim); }
.shot-pin {
  width: 24px; height: 24px; line-height: 20px; text-align: center;
  font-size: 16px; font-weight: 800; color: #fff;
  text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.blood-pin {
  width: 11px; height: 11px; border-radius: 50%;
  background: #b21414; border: 1.5px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.55);
}
.blood-pin.last {
  width: 16px; height: 16px;
  background: #d61f1f; box-shadow: 0 0 0 3px rgba(214,31,31,.35), 0 1px 3px rgba(0,0,0,.55);
}

@media (max-width: 640px) {
  .panel { position: absolute; inset: 0 auto 0 0; }
}

</style>
</head>
<body>
<div id="errbar" role="alert"></div>
<div id="app">
  <button id="panelToggle" class="panel-toggle" title="Show / hide panel" aria-label="Toggle panel">&#9776;</button>
  <aside id="panel" class="panel">
    <header class="panel-head">
      <h1>Deer Planner</h1>
      <div class="panel-sub" id="propLabel">&mdash;</div>
    </header>
    <div class="panel-search">
      <form id="addrForm"><input type="search" id="addrInput" placeholder="Find an address, town or ZIP…" autocomplete="off" /></form>
      <div class="panel-search-res" id="addrRes"></div>
    </div>
    <div class="panel-body" id="panelBody"><!-- rendered by app.js --></div>
    <footer class="panel-foot">
      <button id="btnShare" class="btn btn-ghost">AirDrop</button>
      <button id="btnExport" class="btn btn-ghost">Export</button>
      <button id="btnImport" class="btn btn-ghost">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <input type="file" id="photoFile" accept="image/*" multiple hidden />
      <span class="build-tag">Photos</span>
    </footer>
  </aside>
  <div id="map"></div>
</div>

<script>
/* --- early diagnostics: surface any load/runtime error on-screen --- */
(function () {
  var seen = {};
  function show(msg) {
    if (seen[msg]) return;
    seen[msg] = 1;
    var b = document.getElementById("errbar");
    if (!b) return;
    b.style.display = "block";
    b.textContent = (b.textContent ? b.textContent + "  |  " : "") + msg;
  }
  window.__dpError = show;
  window.addEventListener("error", function (e) {
    show("JS error: " + (e && e.message ? e.message : "unknown") +
         (e && e.filename ? "" : "") + (e && e.lineno ? " @line " + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    show("Promise error: " + (r && r.message ? r.message : String(r)));
  });
  // note the protocol so we can tell file:// vs http
  if (location.protocol === "file:") show("Running from file:// — some browsers (Safari) block weather here; Chrome works.");
})();
